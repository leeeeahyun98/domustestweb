    /* =========================================================
       영업 분석 (관리자 전용) — 수주(ORDERS) 데이터만 기준으로 집계한다.
       매출·미수금은 매출 관리 화면이 별도로 다루므로 여기서는 다루지 않는다.
       ========================================================= */
    function saleOrderDateObj(o){
      if (!o.orderDate || o.orderDate === '—') return null;
      const d = new Date(`${o.orderDate}T00:00:00`);
      return isNaN(d.getTime()) ? null : d;
    }
    function saleKeyOf(d, unit){
      if (unit === 'year') return `${d.getFullYear()}`;
      if (unit === 'quarter') return `${d.getFullYear()}-Q${Math.ceil((d.getMonth()+1)/3)}`;
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }
    function saleKeyLabel(key, unit){
      if (unit === 'year') return `${key}년`;
      if (unit === 'quarter') { const [y,q] = key.split('-Q'); return `${y.slice(2)}.${q}Q`; }
      const [,m] = key.split('-'); return `${Number(m)}월`;
    }
    let analysisUnit = 'month';
    // 수주액 추이 / 수주 건수 추이 각각 독립적으로 "전체" 또는 특정 브랜드를 선택해서 볼 수 있다.
    let analysisAmtEntityFilter = '';
    let analysisCountEntityFilter = '';
    // 브랜드별/담당자별 수주 현황(가로 막대 순위)의 정렬 기준.
    let analysisBrandRankSort = 'amt';
    let analysisRepRankSort = 'amt';

    // 브랜드별 추이 계열 데이터를 만들고 select를 채운 뒤, 선택값(또는 "전체")에 맞는 추이 그래프를 그린다.
    // metric은 'amt'(수주액) 또는 'count'(수주 건수) — 두 차트가 같은 구조를 공유하되 지표만 다르다.
    function renderEntityTrendCard(chartId, selectId, filterVal, setFilter, metric, unitLabel, validOrders, recentKeys, buckets){
      const select = root.getElementById(selectId);
      const allBrandLabels = [...new Set(validOrders.map(o => brandLabel(o.brand)))].sort((a,b) => a.localeCompare(b, 'ko'));
      if (filterVal && !allBrandLabels.includes(filterVal)) { filterVal = ''; setFilter(''); }
      select.innerHTML = `<option value="">전체</option>` + allBrandLabels.map(b => `<option value="${escapeHtml(b)}"${b === filterVal ? ' selected' : ''}>${escapeHtml(b)}</option>`).join('');
      const fmtMetric = metric === 'count' ? (v => `${Math.round(v)}건`) : fmtWon;
      if (!filterVal) {
        renderTrendChart(
          root.getElementById(chartId), recentKeys,
          k => saleKeyLabel(k, analysisUnit),
          k => (buckets.get(k) || {})[metric] || 0,
          fmtMetric, { color: metric === 'count' ? CATEGORICAL_COLORS[1] : CATEGORICAL_COLORS[0], chartH: 200 }
        );
        return;
      }
      const series = buildBrandSeries(
        validOrders, o => saleKeyOf(saleOrderDateObj(o), analysisUnit), o => brandLabel(o.brand), o => o.finalAmount,
        recentKeys, allBrandLabels.length || 1
      );
      const s = series.find(s => s.brand === filterVal);
      renderTrendChart(
        root.getElementById(chartId), recentKeys,
        k => saleKeyLabel(k, analysisUnit),
        k => (s && s.byKey.get(k) && s.byKey.get(k)[metric]) || 0,
        fmtMetric, { color: BRAND_TREND_COLOR, chartH: 200 }
      );
    }

    // 브랜드별/담당자별 수주 현황 — 이번 기간 실적을 금액순 또는 건수순으로 정렬한 가로 막대 리스트.
    // "이 브랜드가 얼마나 잘 하고 있나"를 드롭다운으로 하나씩 눌러보지 않고 한 화면에서 비교할 수 있게 한다.
    function renderRankList(containerId, entries, sortField, barClass){
      if (!entries.length) {
        root.getElementById(containerId).innerHTML = `<div class="hbar-empty">이 기간 데이터가 없습니다</div>`;
        return;
      }
      const sorted = [...entries].sort((a,b) => b[sortField] - a[sortField]).slice(0, 6);
      const max = Math.max(...sorted.map(e => e[sortField]), 1);
      const fmtCell = sortField === 'count' ? (v => `${v}건`) : fmtWon;
      root.getElementById(containerId).innerHTML = sorted.map((e, i) => `
        <div class="hbar-row">
          <div class="hbar-idx">${i+1}</div>
          <div class="hbar-name">${escapeHtml(e.name)}${e.sub ? `<span class="client">${escapeHtml(e.sub)}</span>` : ''}</div>
          <div class="hbar-track"><div class="hbar-fill ${barClass || ''}" style="width:${Math.max(4, Math.round(e[sortField]/max*100))}%"></div></div>
          <div class="hbar-val mono">${fmtCell(e[sortField])}</div>
        </div>
      `).join('');
    }

    function pctDeltaVsPrev(recordsOfEntity, latestKey, unit){
      const buckets = buildPeriodBuckets(recordsOfEntity, o => saleKeyOf(saleOrderDateObj(o), unit), o => saleOrderDateObj(o), o => o.finalAmount);
      const curr = buckets.get(latestKey) || { amt:0, count:0 };
      const prevKey = periodDeltaDefs(unit, false)[0].keyFn(latestKey);
      const prevBucket = buckets.get(prevKey);
      if (!prevBucket) return { curr, pct:null, isNew:false };
      if (!prevBucket.amt) return { curr, pct:null, isNew: curr.amt > 0 };
      return { curr, pct: (curr.amt - prevBucket.amt) / prevBucket.amt * 100, isNew:false };
    }

    // 영업 인사이트 — 눈에 띄는 변화(1위 브랜드, 급감 브랜드, 신규 거래처, 최고 실적 담당자)를
    // 조건이 맞을 때만 문장으로 자동 요약한다. 데이터가 없으면 그 항목은 그냥 건너뛴다.
    function renderInsights(validOrders, latestKey, newClientNames, brandLatestList, repLatestList){
      const insights = [];
      const thisLabel = periodThisLabel(analysisUnit);
      const prevLabel = periodPrevLabel(analysisUnit);
      if (brandLatestList.length) {
        const top = [...brandLatestList].sort((a,b) => b.amt - a.amt)[0];
        if (top.amt > 0) {
          const brandOrders = validOrders.filter(o => brandLabel(o.brand) === top.full);
          const { pct } = pctDeltaVsPrev(brandOrders, latestKey, analysisUnit);
          const deltaText = pct == null ? '' : pct > 0.5 ? ` — ${prevLabel} 대비 <b>${pct.toFixed(0)}% 증가</b>하며` : pct < -0.5 ? ` — ${prevLabel} 대비 ${Math.abs(pct).toFixed(0)}% 감소했지만` : ` — ${prevLabel}과 비슷한 수준으로`;
          insights.push({ cls:'up', icon:'🔺', html: `<b>${escapeHtml(top.full)}</b>${josaGaYi(top.full)}${deltaText} ${thisLabel} 수주액 1위입니다.` });
        }
        let worst = null;
        brandLatestList.forEach(e => {
          if (!e.amt) return;
          const brandOrders = validOrders.filter(o => brandLabel(o.brand) === e.full);
          const { pct } = pctDeltaVsPrev(brandOrders, latestKey, analysisUnit);
          if (pct != null && pct < -10 && (!worst || pct < worst.pct)) worst = { full:e.full, pct };
        });
        if (worst) {
          insights.push({ cls:'down', icon:'⚠️', html: `<b>${escapeHtml(worst.full)}</b>${josaEunNeun(worst.full)} ${prevLabel} 대비 <b>${Math.abs(worst.pct).toFixed(0)}% 감소</b>했습니다 — 확인이 필요해요.` });
        }
      }
      if (newClientNames.length) {
        const lastName = newClientNames[newClientNames.length - 1];
        insights.push({ cls:'new', icon:'🆕', html: `${thisLabel} <b>${newClientNames.map(escapeHtml).join(', ')}</b>${josaWaGwa(lastName)} 신규 거래가 시작됐습니다.` });
      }
      if (repLatestList.length) {
        const topRep = [...repLatestList].sort((a,b) => b.amt - a.amt)[0];
        if (topRep.amt > 0) {
          insights.push({ cls:'person', icon:'👤', html: `<b>${escapeHtml(topRep.name)}</b> 담당자가 ${thisLabel} 가장 높은 수주액(<b>${fmtWon(topRep.amt)}</b>)을 기록했습니다.` });
        }
      }
      const list = root.getElementById('analysisInsightsList');
      if (!insights.length) { list.innerHTML = `<div class="insight-empty">이번 기간에는 특별히 눈에 띄는 변화가 없습니다.</div>`; return; }
      list.innerHTML = insights.map(ins => `
        <div class="insight-row insight-${ins.cls}">
          <div class="insight-text">${ins.html}</div>
        </div>
      `).join('');
    }

    function renderSalesAnalysis(){
      const panel = root.getElementById('salesAnalysisPanel');
      if (!panel) return;
      if (role !== 'owner') { panel.style.display = 'none'; return; }
      panel.style.display = '';

      // 영업 분석은 "수주"(확정된 건)만 집계한다 — 진행 중인 견적은 아직 수주가 아니므로
      // "총 수주 건수·총 수주액"에 섞이면 안 된다(견적은 "영업 내역" 탭 상단 "진행 중 견적" 카드로 따로 본다).
      // 금액도 견적금액(amount)이 아니라 실제로 확정된 수주액(finalAmount)을 기준으로 삼는다.
      const validOrders = ORDERS.filter(o => o.confirmed && o.finalAmount != null && saleOrderDateObj(o));
      // 거래처별 최초 수주일(전체 이력 기준) — 신규/기존 거래처 판정용
      const clientFirstOrder = new Map();
      validOrders.forEach(o => {
        const d = saleOrderDateObj(o);
        const prev = clientFirstOrder.get(o.client);
        if (!prev || d < prev) clientFirstOrder.set(o.client, d);
      });

      const buckets = new Map(); // key -> { amt, count, clients:Set, items }
      validOrders.forEach(o => {
        const key = saleKeyOf(saleOrderDateObj(o), analysisUnit);
        if (!buckets.has(key)) buckets.set(key, { amt:0, count:0, clients:new Set(), items:[] });
        const b = buckets.get(key);
        b.amt += o.finalAmount; b.count += 1; b.clients.add(o.client);
        b.items.push({ date: saleOrderDateObj(o), val: o.finalAmount });
      });
      const sortedKeys = [...buckets.keys()].sort();
      const recentKeys = sortedKeys.slice(-8);
      const latestKey = sortedKeys[sortedKeys.length - 1];
      const latest = latestKey ? buckets.get(latestKey) : { amt:0, count:0, clients:new Set() };

      let newClientCount = 0, existingClientCount = 0;
      latest.clients.forEach(c => {
        const first = clientFirstOrder.get(c);
        const isNew = first && saleKeyOf(first, analysisUnit) === latestKey;
        if (isNew) newClientCount++; else existingClientCount++;
      });

      // 아직 끝나지 않은(진행 중인) 기간과 비교하면 "전월 대비 하락"처럼 보이는 착시가 생기므로,
      // 최신 구간이 오늘이 속한 진행 중 구간이면 그 사실을 라벨에 바로 표시한다.
      const todayKeySales = saleKeyOf(new Date(), analysisUnit);
      const isOngoingSales = latestKey === todayKeySales;
      const cutoffDaySales = isOngoingSales ? dayIndexInPeriod(new Date(), analysisUnit) : null;
      const periodTag = latestKey ? ` (${saleKeyLabel(latestKey, analysisUnit)}${isOngoingSales ? ' · 누적' : ''})` : '';
      root.getElementById('analysisStatRow').innerHTML = `
        <div class="stat">
          <div class="stat-top"><span class="icon-badge green"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><div class="label">총 수주 건수${periodTag}</div></div>
          <div class="num mono">${latest.count}건</div>${compareRowHtml(latestKey, analysisUnit, buckets, 'count', isOngoingSales, cutoffDaySales)}
        </div>
        <div class="stat">
          <div class="stat-top"><span class="icon-badge blue"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span><div class="label">총 수주액${periodTag}</div></div>
          <div class="num mono">${fmtWon(latest.amt)}</div>${compareRowHtml(latestKey, analysisUnit, buckets, 'amt', isOngoingSales, cutoffDaySales)}
        </div>
        <div class="stat">
          <div class="stat-top"><span class="icon-badge blue"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span><div class="label">신규 거래처 수</div></div>
          <div class="num mono">${newClientCount}곳</div>
        </div>
        <div class="stat">
          <div class="stat-top"><span class="icon-badge gray"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg></span><div class="label">기존 거래처 수</div></div>
          <div class="num mono">${existingClientCount}곳</div>
        </div>
      `;

      const unitLabel = analysisUnit === 'month' ? '월별' : analysisUnit === 'quarter' ? '분기별' : '연도별';

      renderEntityTrendCard('analysisAmtChart', 'analysisAmtEntitySelect', analysisAmtEntityFilter, v => analysisAmtEntityFilter = v, 'amt', unitLabel, validOrders, recentKeys, buckets);
      renderEntityTrendCard('analysisCountChart', 'analysisCountEntitySelect', analysisCountEntityFilter, v => analysisCountEntityFilter = v, 'count', unitLabel, validOrders, recentKeys, buckets);

      // 브랜드별/담당자별 수주 현황 — 이번 기간(latestKey) 실적을 집계해서 순위 리스트로 보여준다.
      const brandLatestMap = new Map();
      const repLatestMap = new Map();
      validOrders.filter(o => saleKeyOf(saleOrderDateObj(o), analysisUnit) === latestKey).forEach(o => {
        const b = brandLabel(o.brand);
        // 순위 목록에는 코드(짧은 이름)를 굵게, 전체 명칭은 작은 보조 텍스트로 — brandLabel이 "코드 이름"
        // 형태라 코드를 뗀 나머지를 부제로 쓰고, 마스터에 없어 코드 분리가 안 되면 그냥 생략한다.
        const shortName = shortCode(o.brand);
        const restName = b.startsWith(shortName + ' ') ? b.slice(shortName.length + 1) : '';
        if (!brandLatestMap.has(b)) brandLatestMap.set(b, { name:shortName, sub:restName, full:b, amt:0, count:0 });
        const be = brandLatestMap.get(b); be.amt += o.finalAmount; be.count += 1;
        if (!repLatestMap.has(o.rep)) repLatestMap.set(o.rep, { name:o.rep, amt:0, count:0 });
        const re = repLatestMap.get(o.rep); re.amt += o.finalAmount; re.count += 1;
      });
      const brandLatestList = [...brandLatestMap.values()];
      const repLatestList = [...repLatestMap.values()];
      renderRankList('analysisBrandRankList', brandLatestList, analysisBrandRankSort, '');
      renderRankList('analysisRepRankList', repLatestList, analysisRepRankSort, 'rep');

      const newClientNames = [];
      latest.clients.forEach(c => {
        const first = clientFirstOrder.get(c);
        if (first && saleKeyOf(first, analysisUnit) === latestKey) newClientNames.push(c);
      });
      renderInsights(validOrders, latestKey, newClientNames, brandLatestList, repLatestList);
    }

    root.getElementById('analysisPeriodTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      analysisUnit = btn.dataset.p;
      [...root.querySelectorAll('#analysisPeriodTabs .tab')].forEach(b => b.classList.toggle('active', b === btn));
      renderSalesAnalysis();
    });
    root.getElementById('analysisAmtEntitySelect').addEventListener('change', (e) => {
      analysisAmtEntityFilter = e.target.value;
      renderSalesAnalysis();
    });
    root.getElementById('analysisCountEntitySelect').addEventListener('change', (e) => {
      analysisCountEntityFilter = e.target.value;
      renderSalesAnalysis();
    });
    root.getElementById('analysisBrandRankTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      analysisBrandRankSort = btn.dataset.s;
      [...root.querySelectorAll('#analysisBrandRankTabs .tab')].forEach(b => b.classList.toggle('active', b === btn));
      renderSalesAnalysis();
    });
    root.getElementById('analysisRepRankTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      analysisRepRankSort = btn.dataset.s;
      [...root.querySelectorAll('#analysisRepRankTabs .tab')].forEach(b => b.classList.toggle('active', b === btn));
      renderSalesAnalysis();
    });

    function render(){
      const list = filtered();

      // 상단 통계 카드는 "내역" 표에서 고른 기간 단위(월별/분기별/연도별)의 "가장 최근 기간" 값만 반영한다.
      const validList = list.filter(o => o.amount != null);
      const periodKeysSales = [...new Set(validList.map(listGroupKey))].sort((a,b) => b.localeCompare(a));
      const latestKeySales = periodKeysSales[0] || null;
      const periodListSales = latestKeySales ? validList.filter(o => listGroupKey(o) === latestKeySales) : [];
      const inProgressList = periodListSales.filter(o => !o.confirmed);
      const confirmedListSales = periodListSales.filter(o => o.confirmed);
      const quoteAmount = inProgressList.reduce((s,o) => s + (o.amount || 0), 0);
      const orderAmount = confirmedListSales.reduce((s,o) => s + (o.finalAmount || 0), 0);
      root.getElementById('salesStatQuoteCount').textContent = `${inProgressList.length}건`;
      root.getElementById('salesStatQuoteAmount').textContent = fmtWonMasked(quoteAmount);
      root.getElementById('salesStatOrderCount').textContent = `${confirmedListSales.length}건`;
      root.getElementById('salesStatOrderAmount').textContent = fmtWonMasked(orderAmount);

      // 통계 카드 밑에 이전 기간 대비 증감을 짧게 보여준다 (한눈에 흐름 파악용).
      const prevKeySales = periodKeysSales[1] || null;
      const prevListSales = prevKeySales ? validList.filter(o => listGroupKey(o) === prevKeySales) : [];
      const prevInProgress = prevListSales.filter(o => !o.confirmed);
      const prevConfirmedSales = prevListSales.filter(o => o.confirmed);
      const prevQuoteAmount = prevInProgress.reduce((s,o) => s + (o.amount || 0), 0);
      const prevOrderAmount = prevConfirmedSales.reduce((s,o) => s + (o.finalAmount || 0), 0);
      const deltaLabel = periodDeltaDefs(listPeriod, false)[0].label;
      const cmpHtml = (curr, prev) => prevKeySales
        ? `<div class="stat-compare"><span class="cmp-item">${deltaLabel} ${deltaBadge(curr, prev)}</span></div>`
        : '';
      root.getElementById('salesStatQuoteCountCmp').innerHTML = cmpHtml(inProgressList.length, prevInProgress.length);
      root.getElementById('salesStatQuoteAmountCmp').innerHTML = cmpHtml(quoteAmount, prevQuoteAmount);
      root.getElementById('salesStatOrderCountCmp').innerHTML = cmpHtml(confirmedListSales.length, prevConfirmedSales.length);
      root.getElementById('salesStatOrderAmountCmp').innerHTML = cmpHtml(orderAmount, prevOrderAmount);

      renderRows(list);
      renderClientPanel();
      renderSalesAnalysis();

      const groupCount = new Set(list.map(listGroupKey)).size;
      root.getElementById('salesTableFoot').textContent = `${LIST_PERIOD_LABEL[listPeriod]} 기준 · ${groupCount}개 그룹 · 브랜드: ${fBrand} · 발주처: ${fClient} · 담당자: ${fRep} · 총 ${list.length}건`;
    }

    root.getElementById('searchInput').addEventListener('input', (e) => {
      query = e.target.value.trim();
      render();
    });
    root.getElementById('filterBrand').addEventListener('change', (e) => { fBrand = e.target.value; render(); });
    root.getElementById('filterClient').addEventListener('change', (e) => { fClient = e.target.value; render(); });
    root.getElementById('filterRep').addEventListener('change', (e) => { fRep = e.target.value; render(); });
    root.getElementById('unpaidOnlyBtn').addEventListener('click', () => {
      fUnpaidOnly = !fUnpaidOnly;
      root.getElementById('unpaidOnlyBtn').classList.toggle('active', fUnpaidOnly);
      render();
    });
    root.getElementById('salesPeriodTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      listPeriod = btn.dataset.p;
      [...root.querySelectorAll('#salesPeriodTabs .tab')].forEach(b => b.classList.toggle('active', b === btn));
      render();
    });

    const salesExportBtn = root.getElementById('salesExportBtn');
    if (salesExportBtn) {
      // 엑셀 내보내기는 관리자 계정에서만 사용 — 그 외 계정에서는 버튼 자체를 숨긴다.
      if (role !== 'owner') salesExportBtn.style.display = 'none';
      salesExportBtn.addEventListener('click', () => {
        try {
          const list = filtered();
          const rows = [['발주처','브랜드','담당자','수주일','수주확정일','납품일','견적금액','수주액','확인 여부','입금 여부']].concat(
            list.map(o => [o.client, brandLabel(o.brand), o.rep || '-', o.orderDate || '-', o.confirmDate || '-', o.next || '-', o.amount, o.finalAmount, o.confirmed ? '확인됨' : '확인 대기', isFullyPaid(o) ? '입금완료' : (paidAmount(o) > 0 ? `입금 진행중(${paidAmount(o).toLocaleString('ko-KR')}원)` : '미입금')])
          );
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '영업내역');
          const d = new Date();
          XLSX.writeFile(wb, `도무스_영업관리_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.xlsx`);
        } catch (err) {
          showToast('엑셀 내보내기 중 오류가 발생했습니다: ' + err.message, 'error');
        }
      });
    }

    refreshFilterOptions();
    render();
  }

              <span class="combo-confirm-text">"${escapeHtml(b.name)}" 삭제할까요?</span>
              <button type="button" class="combo-confirm-btn bd-cancel" data-code="${escapeHtml(b.code)}">취소</button>
              <button type="button" class="combo-confirm-btn danger bd-ok" data-code="${escapeHtml(b.code)}">삭제</button>
            </div>
          ` : `
            <div class="combo-item" data-code="${escapeHtml(b.code)}" data-name="${escapeHtml(b.name)}">
              <span class="combo-item-main"><span class="combo-code">${escapeHtml(b.code)}</span><span class="combo-name">${escapeHtml(b.name)}</span></span>
              <button type="button" class="combo-item-del bd-del" data-code="${escapeHtml(b.code)}" title="삭제">✕</button>
            </div>
          `).join('')
        : `<div class="combo-empty">일치하는 브랜드가 없어요</div>`;
      if (brandInput.value.trim() && !exactMatch) {
        html += `<div class="combo-divider"></div><div class="combo-add-trigger" id="brandAddTrigger">＋ "${escapeHtml(brandInput.value.trim())}" 새 브랜드로 등록</div>`;
      }
      brandDropdown.innerHTML = html;
      brandDropdown.hidden = false;
      clientDropdown.hidden = true;
      brandDropdown.querySelectorAll('.combo-item:not(.combo-item-confirm)').forEach(el => {
        el.addEventListener('mousedown', (e) => {
          if (e.target.closest('.bd-del')) return;
          e.preventDefault();
          selectBrand(el.dataset.code, el.dataset.name);
        });
      });
      brandDropdown.querySelectorAll('.bd-del').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          pendingDeleteBrandCode = btn.dataset.code;
          renderBrandDropdown();
        });
      });
      brandDropdown.querySelectorAll('.bd-cancel').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          pendingDeleteBrandCode = null;
          renderBrandDropdown();
        });
      });
      brandDropdown.querySelectorAll('.bd-ok').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          const idx = BRAND_MASTER.findIndex(b => b.code === btn.dataset.code);
          if (idx >= 0) BRAND_MASTER.splice(idx, 1);
          pendingDeleteBrandCode = null;
          rebuildBrandMaps();
          if (window.refreshAllPages) window.refreshAllPages('domus-orderform-page');
          if (brandInput.value.trim().split(' ')[0] === btn.dataset.code) brandInput.value = '';
          showToast('브랜드를 삭제했어요. 기존 수주·매출 기록은 그대로 남아요.');
          renderBrandDropdown();
        });
      });
      const trigger = root.getElementById('brandAddTrigger');
      if (trigger) trigger.addEventListener('mousedown', (e) => { e.preventDefault(); openBrandAddPanel(brandInput.value.trim()); });
    }

    // 이 브랜드로 발주처가 하나만 등록돼 있으면, 발주처를 아직 안 정했을 때 자동으로 채워준다.
    function maybeAutofillClientForBrand(code){
      const links = BRAND_CLIENT_LINKS[code] || [];
      if (links.length === 1 && !clientInput.value.trim()) {
        clientInput.value = links[0];
        applyClientAutofill(links[0]);
        clientHint.textContent = '';
      }
    }

    function selectBrand(code, name){
      brandInput.value = brandLabel(code) || `${code} ${name}`;
      brandHint.textContent = '';
      brandAddPanel.hidden = true;
      closeDropdowns();
      maybeAutofillClientForBrand(code);
    }

    function openBrandAddPanel(prefillName){
      brandDropdown.hidden = true;
      brandHint.textContent = `＋ "${prefillName}"는 새 브랜드예요 — 아래에서 코드를 정해 등록해주세요`;
      brandHint.className = 'hint new';
      brandAddPanel.hidden = false;
      brandAddPanel.innerHTML = `
        <div class="combo-add-title">새 브랜드로 등록</div>
        <div class="combo-add-row">
          <div class="combo-add-field code"><label>코드</label><input class="ba-code" placeholder="예: NK"></div>
          <div class="combo-add-field grow"><label>브랜드명</label><input class="ba-name" value="${escapeHtml(prefillName)}"></div>
        </div>
        <div class="combo-add-actions">
          <button type="button" class="btn ba-cancel">취소</button>
          <button type="button" class="btn primary ba-ok">등록</button>
        </div>
      `;
      brandAddPanel.querySelector('.ba-cancel').addEventListener('click', () => {
        brandAddPanel.hidden = true; brandHint.textContent = ''; brandHint.className = 'hint';
      });
      brandAddPanel.querySelector('.ba-ok').addEventListener('click', () => {
        const code = brandAddPanel.querySelector('.ba-code').value.trim();
        const name = brandAddPanel.querySelector('.ba-name').value.trim();
        if (!code || !name) { showToast('코드와 브랜드명을 모두 입력해주세요.', 'error'); return; }
        if (BRAND_MASTER.some(b => b.code === code)) { showToast('이미 있는 코드예요. 다른 코드를 써주세요.', 'error'); return; }
        BRAND_MASTER.push({ id: BRAND_ID_SEQ++, code, name, client:'', clientCode:'', aliases:[], clientAliases:[] });
        rebuildBrandMaps();
        // 지금 작성 중인 이 폼(점포명·수주일·일정 등)은 그대로 두고, 브랜드 관리 등 다른 화면만 최신 상태로 갱신한다.
        if (window.refreshAllPages) window.refreshAllPages('domus-orderform-page');
        brandInput.value = `${code} ${name}`;
        brandAddPanel.hidden = true; brandHint.textContent = ''; brandHint.className = 'hint';
      });
      brandAddPanel.querySelector('.ba-code').focus();
    }

    brandInput.addEventListener('focus', renderBrandDropdown);
    brandInput.addEventListener('input', () => {
      brandHint.textContent = '';
      brandAddPanel.hidden = true;
      renderBrandDropdown();
      // 드롭다운에서 고르지 않고 "코드 이름" 형식을 그대로 입력(또는 다른 화면에서 값만 채워 넣는 경우)해도
      // 알고 있는 브랜드면 발주처 자동 채움이 똑같이 동작하게 한다.
      const v = brandInput.value.trim();
      const code = BRAND_MASTER.some(b => `${b.code} ${b.name}` === v) ? v.split(' ')[0] : '';
      if (code) maybeAutofillClientForBrand(code);
    });

    // ---- 발주처 ----
    function clientCandidates(){
      const code = currentBrandCode();
      if (code && BRAND_CLIENT_LINKS[code] && BRAND_CLIENT_LINKS[code].length) return BRAND_CLIENT_LINKS[code];
      // 브랜드를 아직 못 알아봤거나 등록된 발주처가 없으면, 전체 발주처 목록에서 고를 수 있게 한다.
      return [...new Set([...CLIENT_MASTER.map(c => c.name), ...CLIENT_ONLY_LIST, ...Object.keys(CLIENTS)])];
    }

    let pendingDeleteClientName = null;
    function renderClientDropdown(){
      const q = clientInput.value.trim().toLowerCase();
      const code = currentBrandCode();
      const filteredToBrand = !!(code && BRAND_CLIENT_LINKS[code] && BRAND_CLIENT_LINKS[code].length);
      const names = clientCandidates().filter(n => !q || n.toLowerCase().includes(q));
      const exactMatch = clientCandidates().includes(clientInput.value.trim());
      let html = '';
      if (filteredToBrand) html += `<div class="combo-group-label">${escapeHtml(brandInput.value.trim())}의 발주처</div>`;
      html += names.length
        ? names.map(n => {
            if (n === pendingDeleteClientName) {
              return `
                <div class="combo-item combo-item-confirm" data-name="${escapeHtml(n)}">
                  <span class="combo-confirm-text">"${escapeHtml(n)}" 삭제할까요?</span>
                  <button type="button" class="combo-confirm-btn cd-cancel" data-name="${escapeHtml(n)}">취소</button>
                  <button type="button" class="combo-confirm-btn danger cd-ok" data-name="${escapeHtml(n)}">삭제</button>
                </div>
              `;
            }
            const c = CLIENT_CODE_MAP[n];
            const deletable = CLIENT_MASTER.some(cm => cm.name === n);
            return `
              <div class="combo-item" data-name="${escapeHtml(n)}">
                <span class="combo-item-main">${c ? `<span class="combo-code">${escapeHtml(c)}</span>` : ''}<span class="combo-name">${escapeHtml(n)}</span></span>
                ${deletable ? `<button type="button" class="combo-item-del cd-del" data-name="${escapeHtml(n)}" title="삭제">✕</button>` : ''}
              </div>
            `;
          }).join('')
        : `<div class="combo-empty">일치하는 발주처가 없어요</div>`;
      if (clientInput.value.trim() && !exactMatch) {
        html += `<div class="combo-divider"></div><div class="combo-add-trigger" id="clientAddTrigger">＋ "${escapeHtml(clientInput.value.trim())}" 새 발주처로 등록</div>`;
      }
      clientDropdown.innerHTML = html;
      clientDropdown.hidden = false;
      brandDropdown.hidden = true;
      clientDropdown.querySelectorAll('.combo-item:not(.combo-item-confirm)').forEach(el => {
        el.addEventListener('mousedown', (e) => {
          if (e.target.closest('.cd-del')) return;
          e.preventDefault();
          selectClient(el.dataset.name);
        });
      });
      clientDropdown.querySelectorAll('.cd-del').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          pendingDeleteClientName = btn.dataset.name;
          renderClientDropdown();
        });
      });
      clientDropdown.querySelectorAll('.cd-cancel').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          pendingDeleteClientName = null;
          renderClientDropdown();
        });
      });
      clientDropdown.querySelectorAll('.cd-ok').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          const name = btn.dataset.name;
          const idx = CLIENT_MASTER.findIndex(c => c.name === name);
          if (idx >= 0) CLIENT_MASTER.splice(idx, 1);
          Object.keys(BRAND_CLIENT_LINKS).forEach(k => {
            BRAND_CLIENT_LINKS[k] = BRAND_CLIENT_LINKS[k].filter(n => n !== name);
          });
          pendingDeleteClientName = null;
          rebuildClientMap();
          if (window.refreshAllPages) window.refreshAllPages('domus-orderform-page');
          if (clientInput.value.trim() === name) clientInput.value = '';
          showToast('발주처를 삭제했어요. 기존 수주·매출 기록은 그대로 남아요.');
          renderClientDropdown();
        });
      });
      const trigger = root.getElementById('clientAddTrigger');
      if (trigger) trigger.addEventListener('mousedown', (e) => { e.preventDefault(); openClientAddPanel(clientInput.value.trim()); });
    }

    function selectClient(name){
      clientInput.value = name;
      clientHint.textContent = '';
      clientAddPanel.hidden = true;
      closeDropdowns();
      applyClientAutofill(name);
    }

    function openClientAddPanel(prefillName){
      clientDropdown.hidden = true;
      clientHint.textContent = `＋ "${prefillName}"는 새 발주처예요`;
      clientHint.className = 'hint new';
      clientAddPanel.hidden = false;
      clientAddPanel.innerHTML = `
        <div class="combo-add-title">새 발주처로 등록</div>
        <div class="combo-add-row">
          <div class="combo-add-field code"><label>코드</label><input class="ca-code" placeholder="예: KK"></div>
          <div class="combo-add-field grow"><label>발주처명</label><input class="ca-name" value="${escapeHtml(prefillName)}"></div>
        </div>
        <div class="combo-add-actions">
          <button type="button" class="btn ca-cancel">취소</button>
          <button type="button" class="btn primary ca-ok">등록</button>
        </div>
      `;
      clientAddPanel.querySelector('.ca-cancel').addEventListener('click', () => {
        clientAddPanel.hidden = true; clientHint.textContent = ''; clientHint.className = 'hint';
      });
      clientAddPanel.querySelector('.ca-ok').addEventListener('click', () => {
        const code = clientAddPanel.querySelector('.ca-code').value.trim();
        const name = clientAddPanel.querySelector('.ca-name').value.trim();
        if (!name) { showToast('발주처명을 입력해주세요.', 'error'); return; }
        if (!CLIENT_MASTER.some(c => c.name === name)) {
          CLIENT_MASTER.push({ name, code });
          rebuildClientMap();
        }
        const brandCode = currentBrandCode();
        if (brandCode) {
          if (!BRAND_CLIENT_LINKS[brandCode]) BRAND_CLIENT_LINKS[brandCode] = [];
          if (!BRAND_CLIENT_LINKS[brandCode].includes(name)) BRAND_CLIENT_LINKS[brandCode].push(name);
        }
        if (window.refreshAllPages) window.refreshAllPages('domus-orderform-page');
        clientInput.value = name;
        clientAddPanel.hidden = true; clientHint.textContent = ''; clientHint.className = 'hint';
        applyClientAutofill(name);
      });
      clientAddPanel.querySelector('.ca-code').focus();
    }

    clientInput.addEventListener('focus', renderClientDropdown);
    clientInput.addEventListener('input', () => {
      clientHint.textContent = '';
      clientAddPanel.hidden = true;
      renderClientDropdown();
    });

    root.addEventListener('click', (e) => {
      if (!e.target.closest('.combo-field')) closeDropdowns();
    });

    root.getElementById('orderTypeChips').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      [...chip.parentElement.children].forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });

    const contactToggle = root.getElementById('contactToggle');
    const contactBody = root.getElementById('contactBody');
    contactToggle.addEventListener('click', () => {
      contactToggle.classList.toggle('open');
      contactBody.classList.toggle('open');
    });

    const taskList = root.getElementById('taskList');
    let taskCount = 0;
    function renumberTasks(){
      [...taskList.querySelectorAll('.task-row')].forEach((row, i) => {
        const num = row.querySelector('.task-num');
        if (num) num.textContent = i + 1;
      });
    }
    function addTaskRow(){
      taskCount++;
      const row = document.createElement('div');
      row.className = 'task-row';
      row.innerHTML = `
        <div class="task-item-head">
          <button class="remove-task" style="display:${taskCount > 1 ? 'inline' : 'none'}">삭제</button>
        </div>
        <div class="task-grid">
          <div class="field"><label>날짜</label><input type="date"></div>
          <div class="field"><label>시각</label>
            <div class="time-select-row">
              <select class="task-time-h"></select>
            </div>
          </div>
          <div class="field task-full">
            <label>작업 구분</label>
            <div class="chip-group task-material-chips">
              <div class="chip active" data-v="일반">일반</div>
              <div class="chip" data-v="금속">금속</div>
            </div>
          </div>
          <div class="field task-full">
            <label>작업 내용</label>
            <input class="task-desc" placeholder="납품 품목">
          </div>
          <div class="field task-full">
            <label>작업량</label>
            <select class="qty-select">
              <option value="5">5</option><option value="10">10</option><option value="20" selected>20</option>
              <option value="30">30</option><option value="40">40</option><option value="50">50</option>
              <option value="60">60</option><option value="70">70</option><option value="80">80</option>
              <option value="90">90</option><option value="100">100</option><option value="150">150</option>
              <option value="200">200</option><option value="300">300</option>
              <option value="단납">단납</option>
              <option value="custom">직접입력...</option>
            </select>
            <input type="number" class="qty-custom" placeholder="작업량 직접 입력" style="display:none; margin-top:6px;">
          </div>
        </div>
      `;
      const removeBtn = row.querySelector('.remove-task');
      removeBtn.addEventListener('click', () => {
        row.remove();
        renumberTasks();
        updateSummary();
      });
      const timeH = row.querySelector('.task-time-h');
      timeH.innerHTML = Array.from({length:24}, (_,i) => `<option value="${i}"${i===9?' selected':''}>${String(i).padStart(2,'0')}</option>`).join('');
      // 목재/금속을 하나의 토글 버튼 안에 묶어뒀더니 지금 상태를 알아보기 어렵다는 의견이 있어,
      // 수주타입(일반/긴급)과 같은 방식으로 두 개를 나란히 놓고 고르게 했다.
      row.querySelector('.task-material-chips').addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        [...row.querySelectorAll('.task-material-chips .chip')].forEach(c => c.classList.toggle('active', c === chip));
      });
      const qtySelect = row.querySelector('.qty-select');
      const qtyCustom = row.querySelector('.qty-custom');
      qtySelect.addEventListener('change', () => {
        qtyCustom.style.display = qtySelect.value === 'custom' ? 'block' : 'none';
      });
      row.querySelector('input[type="date"]').addEventListener('change', updateSummary);
      taskList.appendChild(row);
      renumberTasks();
      updateSummary();
    }
    addTaskRow();
    root.getElementById('addTask').addEventListener('click', addTaskRow);

    // 사이드바 "등록 요약"에 지금까지 입력한 값을 실시간으로 반영한다.
    function updateSummary(){
      const val = (id) => { const el = root.getElementById(id); return el ? el.value.trim() : ''; };
      root.getElementById('sumBrand').textContent = val('f-brand') || '-';
      root.getElementById('sumClient').textContent = val('f-client') || '-';
      root.getElementById('sumStore').textContent = val('f-store') || '-';
      root.getElementById('sumRep').textContent = repSelect.value || '-';
      const orderDate = val('f-orderdate');
      root.getElementById('sumOrderdate').textContent = orderDate || '-';
      const amountVal = val('f-amount');
      root.getElementById('sumAmount').textContent = amountVal ? `${amountVal}원` : '-';
      const rows = [...taskList.querySelectorAll('.task-row')];
      const withDate = rows.filter(r => r.querySelector('input[type="date"]').value).length;
      root.getElementById('sumTaskCount').textContent = rows.length === 0
        ? '등록된 납품 일정 없음'
        : `납품 일정 ${rows.length}건 (날짜 입력 ${withDate}건)`;
    }
    ['f-brand', 'f-client', 'f-store', 'f-orderdate', 'f-amount'].forEach(id => {
      root.getElementById(id).addEventListener('input', updateSummary);
    });
    repSelect.addEventListener('change', updateSummary);
    updateSummary();

    // 저장 버튼(데스크탑/모바일 두 개)이 연속 클릭되거나, 뒤에서 refreshAllPages() 흐름이
    // 바뀌어 이 화면이 더 이상 자동으로 재마운트되지 않게 되더라도, 같은 내용이 중복
    // 저장되지 않도록 명시적으로 막는다(우연히 재마운트에 기대던 기존 방식 대신).
    let isSaving = false;
    function saveOrder(){
      if (isSaving) return;

      const missing = [];
      if (!root.getElementById('f-brand').value.trim()) missing.push('브랜드');
      if (!root.getElementById('f-client').value.trim()) missing.push('발주처');
      if (!root.getElementById('f-store').value.trim()) missing.push('점포명');
      if (!repSelect.value) missing.push('담당자');
      if (!root.getElementById('f-orderdate').value) missing.push('수주일');
      if (missing.length) {
        showToast(`다음 항목을 입력해주세요: ${missing.join(', ')}`, 'error');
        return;
      }

      isSaving = true;

      const brandVal = root.getElementById('f-brand').value.trim();
      const clientVal = root.getElementById('f-client').value.trim();
      const storeVal = root.getElementById('f-store').value.trim();
      const repVal = repSelect.value;
      const orderDateIso = root.getElementById('f-orderdate').value;
      const confirmDateIso = root.getElementById('f-confirmdate').value;
      const activeTypeChip = root.getElementById('orderTypeChips').querySelector('.chip.active');
      const urgent = !!activeTypeChip && activeTypeChip.dataset.v === '긴급';
      const amountRaw = stripCommas(root.getElementById('f-amount').value);
      const amount = amountRaw ? Number(amountRaw) : null;

      // 새 수주 건의 id — 영업 관리가 그대로 참조하는 ORDERS 배열에 실제로 추가한다.
      const newOrderId = ORDERS.length ? Math.max(...ORDERS.map(o => o.id)) + 1 : 0;

      // 납품 일정 행들을 ORDER_TASKS로 옮겨서, 일정표·오늘 할 일 화면이 바로 읽어가도록 한다.
      const taskDates = [];
      [...taskList.querySelectorAll('.task-row')].forEach(row => {
        const dateInput = row.querySelector('input[type="date"]');
        const dateVal = dateInput ? dateInput.value : '';
        if (!dateVal) return;
        const h = row.querySelector('.task-time-h').value.padStart(2, '0');
        const desc = row.querySelector('.task-desc').value.trim();
        const isMetal = row.querySelector('.task-material-chips .chip.active').dataset.v === '금속';
        const qtySelect = row.querySelector('.qty-select');
        const qty = qtySelect.value === 'custom' ? (row.querySelector('.qty-custom').value.trim() || '-') : qtySelect.value;
        const taskId = ORDER_TASKS.length ? Math.max(...ORDER_TASKS.map(t => t.id)) + 1 : 0;
        ORDER_TASKS.push({
          id: taskId, orderId: newOrderId, date: dateVal, time: `${h}:00`,
          brand: brandVal.split(' ')[0], store: storeVal, client: clientVal, task: desc || '납품',
          material: isMetal ? '금속' : '', qty, op: repVal, solo: false, done: false,
        });
        taskDates.push(dateVal);
      });
      taskDates.sort();
      const nextField = taskDates.length ? taskDates[0] : '—';

      ORDERS.push({
        id: newOrderId, brand: brandVal, client: clientVal, store: storeVal, rep: repVal,
        orderDate: orderDateIso, confirmDate: confirmDateIso || '—',
        urgent, next: nextField, amount, finalAmount: null, confirmed: false, paid: false,
      });

      showToast('수주가 등록되었습니다. 영업 관리·일정표에 바로 반영됩니다.');
      if (typeof window.refreshAllPages === 'function') window.refreshAllPages();
      // refreshAllPages()가 이 화면도 함께 재마운트하므로 보통은 여기 도달하기 전에 이미
      // 새 initOrderFormPage 인스턴스로 교체되지만, 혹시 이 화면이 재마운트 대상에서
      // 제외되도록 바뀌더라도 계속 저장할 수 있게 안전하게 플래그를 되돌려 둔다.

    }

  function initTasksPage(root){
    function pad(n){ return String(n).padStart(2,'0'); }
    function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    function addDays(base, n){ const d = new Date(base); d.setDate(d.getDate()+n); return d; }

    const today = new Date();
    today.setHours(0,0,0,0);

    const rawTasks = [
      { offset:0, time:'09:00', client:'ND 미도인베이커리 본점', type:'납품', task:'비말차단 진열대 납품', qty:5, op:'최민서', done:false },
      { offset:0, time:'10:30', client:'CG 카페드마르쉐 잠실점', type:'배송', task:'도어틀, 몰딩 배송', qty:10, op:'박성중', done:false },
      { offset:0, time:'13:00', client:'K2 브레드팜 강남점', type:'납품', task:'진열대 3type 배송', qty:20, op:'김도현', done:true },
      { offset:0, time:'16:00', client:'CG 카페드마르쉐 잠실점', type:'납품', task:'냉장 쇼케이스 납품', qty:20, op:'최민서', done:false },
      { offset:1, time:'09:30', client:'KK 라뜰리에드빵 강남점', type:'배송', task:'우드프레임 배송', qty:10, op:'박지훈', done:false },
      { offset:1, time:'13:00', client:'K2 브레드팜 송파점', type:'납품', task:'진열대 3type 납품', qty:30, op:'최민서', done:false },
      { offset:2, time:'11:00', client:'K2 브레드팜 강남점', type:'납품', task:'진열대 3type 배송', qty:100, op:'김도현', done:false },
    ];

    const tasksByDay = {};
    rawTasks.forEach(t => {
      const d = addDays(today, t.offset);
      const key = ymd(d);
      if (!tasksByDay[key]) tasksByDay[key] = [];
      tasksByDay[key].push({ ...t, id: Math.random().toString(36).slice(2) });
    });
    // 수주 등록에서 저장된 납품 일정도 같은 형식으로 합쳐서 표시한다.
    // 표시명은 일정표와 동일하게 "브랜드코드 점포명(발주처/담당자)" 형식으로 맞춘다.
    ORDER_TASKS.forEach(t => {
      const key = t.date;
      if (!tasksByDay[key]) tasksByDay[key] = [];
      tasksByDay[key].push({
        client: `${t.brand}${t.store}(${clientShortCode(t.client)}/${t.op})`, type: t.material === '금속' ? '납품' : '배송', task: t.task,
        qty: t.qty, op: t.op, time: t.time, id: 'ot' + t.id, __orderTaskRef: t, get done(){ return t.done; }, set done(v){ t.done = v; },
      });
    });
    Object.values(tasksByDay).forEach(list => list.sort((a,b) => a.time.localeCompare(b.time)));

    const WEEKDAYS = ['일','월','화','수','목','금','토'];
    const days = [0,1,2].map(n => addDays(today, n));
    let activeDay = ymd(today);
    let query = '';

    const dayTabs = root.getElementById('dayTabs');
    days.forEach(d => {
      const key = ymd(d);
      const btn = document.createElement('button');
      btn.className = 'daytab' + (key === activeDay ? ' active' : '');
      btn.textContent = key === ymd(today) ? '오늘' : `${d.getMonth()+1}/${d.getDate()}(${WEEKDAYS[d.getDay()]})`;
      btn.addEventListener('click', () => { activeDay = key; render(); });
      btn.dataset.key = key;
      dayTabs.appendChild(btn);
    });

    root.getElementById('searchInput').addEventListener('input', (e) => {
      query = e.target.value.trim();
      render();
    });

    function render(){
      [...dayTabs.children].forEach(btn => btn.classList.toggle('active', btn.dataset.key === activeDay));

      let list = tasksByDay[activeDay] || [];
      if (query) list = list.filter(t => t.client.includes(query));

      const total = list.length;
      const doneCount = list.filter(t => t.done).length;
      root.getElementById('statTotal').textContent = total;
      root.getElementById('statDone').textContent = doneCount;
      root.getElementById('statLeft').textContent = total - doneCount;

      const listEl = root.getElementById('taskList');
      listEl.innerHTML = '';
      if (!list.length) {
        listEl.innerHTML = '<div class="empty">이 날짜에 등록된 작업이 없습니다.</div>';
        return;
      }
      list.forEach(t => {
        const row = document.createElement('div');
        row.className = 'task' + (t.done ? ' done' : '');
        row.innerHTML = `
          <div class="time mono">${t.time}</div>
          <div class="body">
            <div class="client">${escapeHtml(t.client)}</div>
            <div class="desc"><span class="type-tag">[${t.type}]</span> ${escapeHtml(t.task)} · 작업량 ${t.qty}% · ${escapeHtml(t.op)}</div>
          </div>
          <div class="check">✓</div>
        `;
        row.addEventListener('click', () => {
          t.done = !t.done;
          render();
        });
        listEl.appendChild(row);
      });
    }

    render();
  }

  function initRevenuePage(root, appRole, currentRep){
    const won = n => n.toLocaleString('ko-KR') + '원';
    const pad2 = n => String(n).padStart(2,'0');
    const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    // 영업 관리와 같은 압축 날짜 표기("2025-08-15" -> "25.08.15") — 두 화면을 나란히 비교하기 쉽게 맞춘다.
    function dispDateRev(iso){
      if (!iso || iso === '—') return '-';
      const parts = iso.split('-');
      if (parts.length !== 3) return iso;
      const [y, m, d] = parts;
      return `${y.slice(2)}.${m}.${d}`;
    }
    // 매출 건이 어느 수주에서 왔는지 찾아서, 영업 관리에서 보던 수주일·수주확정일도 여기서 바로
    // 비교할 수 있게 한다. 연동 이전에 이미 있던 예시 매출 데이터는 연결된 수주가 없어 "-"로 남는다.
    function linkedOrderOfRev(r){
      if (r.linkedOrderId == null) return null;
      return ORDERS.find(o => o.id === r.linkedOrderId) || null;
    }

    const REP_LIST = ['이현재', '박성중', '이재황', '김선우'];

    // 매출 관리는 관리자 전용 화면이다. 메뉴(nav)에서 숨기는 것만으로는 개발자도구 등으로
    // 강제 진입했을 때 전체 매출·목표 데이터가 그대로 노출될 수 있으므로, 화면 진입 시점에도
    // 한 번 더 역할을 확인해서 관리자가 아니면 데이터를 아예 그리지 않는다(2차 방어).
    // 아래부터는 이 검증을 통과한 "관리자 세션"에서만 실행되므로, 담당자용 마스킹/필터링
    // 로직을 별도로 둘 필요가 없다(과거에는 담당자 미리보기 모드가 있었으나 지금은 없음).
    if (appRole !== 'owner') {
      const lockPage = root.querySelector('.page');

        lockPage.innerHTML = `
          <div style="padding:100px 24px; text-align:center; color:var(--text-faint); font-size:14px; max-width:420px; margin:0 auto;">
            매출 관리는 관리자 계정에서만 볼 수 있습니다.
          </div>
        `;
      }
      return;
    }

    // 다른 화면과 공유하는 모듈 공용 데이터(REVENUE_ALL)를 그대로 사용한다 — 관리자는 항상 전체를 본다.
    const rawRevenue = REVENUE_ALL;

    // 입금은 한 번에 들어오지 않고 계약금·중도금·잔금처럼 여러 번에 걸쳐 들어오는 경우가 많다.
    // r.payments가 있으면 그 내역의 합으로 입금액을 계산하고, 없으면 기존 paid(boolean) 방식을 그대로 따른다.
    function totalDueRev(r){ return r.finalAmount || 0; }
    function paidAmountRev(r){
      if (Array.isArray(r.payments)) return r.payments.reduce((s,p) => s + (p.amount || 0), 0);
      return r.paid ? totalDueRev(r) : 0;
    }
    function isFullyPaidRev(r){ const total = totalDueRev(r); return total > 0 && paidAmountRev(r) >= total; }

    const revenueTargets = REVENUE_TARGETS; // 모듈 스코프 배열을 그대로 참조 — refresh() 되어도 목표가 유지된다.
    let targetType = 'month';

    // "내역" / "매출 분석" 상단 탭 — 매출 관리는 관리자 전용 메뉴이므로 두 탭 모두 항상 노출한다.

      [...root.querySelectorAll('.section-panel')].forEach(p => { p.hidden = p.dataset.sec !== sec; });
      // 매출 분석 탭에 있을 때만 월별/분기별/연도별 기간 탭을 탭 바 오른쪽에 보여준다
      // — "매출 분석" 제목 글씨가 탭 이름과 중복돼서 없앤 대신, 이 탭이 분석 전용 컨트롤임을

    });

    let period = 'month';
    let brandFilterVal = '전체';
    let clientFilterVal = '전체';
    let repFilterVal = '전체';
    let unpaidOnlyVal = false;
    // 내역이 많아지면 계속 스크롤을 내려야 하는 게 불편하다는 피드백을 반영해,
    // 기간별 묶음을 아코디언처럼 접고 펼 수 있게 한다. 처음 렌더링될 때 딱 한 번만
    // "가장 최근 묶음"을 기본으로 펼쳐두고, 그 뒤로는 사용자가 직접 누른 것만 반영한다.
    let expandedGroups = null;
    let analysisUnit = 'month';
    // 매출액 추이 / 매출 건수 추이 각각 독립적으로 "전체" 또는 특정 브랜드를 선택해서 볼 수 있다.
    let analysisAmtEntityFilter = '';
    let analysisCountEntityFilter = '';
    // 브랜드별/발주처별 매출 현황(가로 막대 순위)의 정렬 기준.
    let analysisBrandRankSort = 'amt';
    let analysisClientRankSort = 'amt';

    function renderEntityTrendCardRev(chartId, selectId, filterVal, setFilter, metric, rows, recentKeys, buckets){
      const select = root.getElementById(selectId);
      const allBrandLabels = [...new Set(rows.map(r => brandLabel(r.brand)))].sort((a,b) => a.localeCompare(b, 'ko'));
      if (filterVal && !allBrandLabels.includes(filterVal)) { filterVal = ''; setFilter(''); }
      select.innerHTML = `<option value="">전체</option>` + allBrandLabels.map(b => `<option value="${escapeHtml(b)}"${b === filterVal ? ' selected' : ''}>${escapeHtml(b)}</option>`).join('');
      const fmtMetric = metric === 'count' ? (v => `${Math.round(v)}건`) : won;
      if (!filterVal) {

          fmtMetric, { color: metric === 'count' ? CATEGORICAL_COLORS[1] : CATEGORICAL_COLORS[0], chartH:200 }
        );

      }
      const series = buildBrandSeries(rows, r => analysisKeyOf(r.date, analysisUnit), r => brandLabel(r.brand), r => r.finalAmount, recentKeys, allBrandLabels.length || 1);
      const s = series.find(s => s.brand === filterVal);
      renderTrendChart(
