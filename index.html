    function renderRankListRev(containerId, entries, sortField, barClass){
      if (!entries.length) {
        root.getElementById(containerId).innerHTML = `<div class="hbar-empty">이 기간 데이터가 없습니다</div>`;
        return;
      }
      const sorted = [...entries].sort((a,b) => b[sortField] - a[sortField]).slice(0, 6);
      const max = Math.max(...sorted.map(e => e[sortField]), 1);
      const fmtCell = sortField === 'count' ? (v => `${v}건`) : won;
      root.getElementById(containerId).innerHTML = sorted.map((e, i) => `
        <div class="hbar-row">
          <div class="hbar-idx">${i+1}</div>
          <div class="hbar-name">${escapeHtml(e.name)}${e.sub ? `<span class="client">${escapeHtml(e.sub)}</span>` : ''}</div>
          <div class="hbar-track"><div class="hbar-fill ${barClass || ''}" style="width:${Math.max(4, Math.round(e[sortField]/max*100))}%"></div></div>
          <div class="hbar-val mono">${fmtCell(e[sortField])}</div>
        </div>
      `).join('');
    }

    function pctDeltaVsPrevRev(recordsOfEntity, latestKey, unit){
      const buckets = buildPeriodBuckets(recordsOfEntity, r => analysisKeyOf(r.date, unit), r => new Date(`${r.date}T00:00:00`), r => r.finalAmount);
      const curr = buckets.get(latestKey) || { amt:0, count:0 };
      const prevKey = periodDeltaDefs(unit, false)[0].keyFn(latestKey);
      const prevBucket = buckets.get(prevKey);
      if (!prevBucket) return { curr, pct:null };
      if (!prevBucket.amt) return { curr, pct:null, isNew: curr.amt > 0 };
      return { curr, pct: (curr.amt - prevBucket.amt) / prevBucket.amt * 100 };
    }

    // 매출 인사이트 — 눈에 띄는 변화(1위 브랜드, 급감 브랜드, 최고 매출 발주처)를 조건이 맞을 때만 문장으로 요약한다.
    function renderRevInsights(rows, latestKey, brandLatestList, clientLatestList){
      const insights = [];
      const thisLabel = periodThisLabel(analysisUnit);
      const prevLabel = periodPrevLabel(analysisUnit);
      if (brandLatestList.length) {
        const top = [...brandLatestList].sort((a,b) => b.amt - a.amt)[0];
        if (top.amt > 0) {
          const brandRows = rows.filter(r => brandLabel(r.brand) === top.full);
          const { pct } = pctDeltaVsPrevRev(brandRows, latestKey, analysisUnit);
          const deltaText = pct == null ? '' : pct > 0.5 ? ` — ${prevLabel} 대비 <b>${pct.toFixed(0)}% 증가</b>하며` : pct < -0.5 ? ` — ${prevLabel} 대비 ${Math.abs(pct).toFixed(0)}% 감소했지만` : ` — ${prevLabel}과 비슷한 수준으로`;
          insights.push({ cls:'up', icon:'🔺', html: `<b>${escapeHtml(top.full)}</b>${josaGaYi(top.full)}${deltaText} ${thisLabel} 매출액 1위입니다.` });
        }
        let worst = null;
        brandLatestList.forEach(e => {
          if (!e.amt) return;
          const brandRows = rows.filter(r => brandLabel(r.brand) === e.full);
          const { pct } = pctDeltaVsPrevRev(brandRows, latestKey, analysisUnit);
          if (pct != null && pct < -10 && (!worst || pct < worst.pct)) worst = { full:e.full, pct };
        });
        if (worst) {
          insights.push({ cls:'down', icon:'⚠️', html: `<b>${escapeHtml(worst.full)}</b>${josaEunNeun(worst.full)} ${prevLabel} 대비 <b>${Math.abs(worst.pct).toFixed(0)}% 감소</b>했습니다 — 확인이 필요해요.` });
        }
      }
      if (clientLatestList.length) {
        const topClient = [...clientLatestList].sort((a,b) => b.amt - a.amt)[0];
        if (topClient.amt > 0) {
          insights.push({ cls:'person', icon:'🏢', html: `<b>${escapeHtml(topClient.name)}</b>${josaGaYi(topClient.name)} ${thisLabel} 가장 높은 매출(<b>${won(topClient.amt)}</b>)을 기록했습니다.` });
        }
      }
      const list = root.getElementById('revInsightsList');
      if (!insights.length) { list.innerHTML = `<div class="insight-empty">이번 기간에는 특별히 눈에 띄는 변화가 없습니다.</div>`; return; }
      list.innerHTML = insights.map(ins => `
        <div class="insight-row insight-${ins.cls}">
          <div class="insight-text">${ins.html}</div>
        </div>
      `).join('');
    }

    function refreshBrandOptions(){
      const brands = ['전체', ...new Set(rawRevenue.map(r => r.brand))];
      const sel = root.getElementById('brandFilter');
      sel.innerHTML = brands.map(b => `<option value="${escapeHtml(b)}">${b === '전체' ? escapeHtml(b) : escapeHtml(brandLabel(b))}</option>`).join('');
      sel.value = brands.includes(brandFilterVal) ? brandFilterVal : '전체';
      brandFilterVal = sel.value;

      const clients = ['전체', ...new Set(rawRevenue.map(r => r.client).filter(Boolean))];
      const clientSel = root.getElementById('clientFilter');
      clientSel.innerHTML = clients.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      clientSel.value = clients.includes(clientFilterVal) ? clientFilterVal : '전체';
      clientFilterVal = clientSel.value;

      const reps = ['전체', ...new Set(rawRevenue.map(r => r.rep).filter(Boolean))];
      const repSel = root.getElementById('repFilter');
      repSel.innerHTML = reps.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
      repSel.value = reps.includes(repFilterVal) ? repFilterVal : '전체';
      repFilterVal = repSel.value;
    }
    refreshBrandOptions();
    root.getElementById('brandFilter').addEventListener('change', (e) => { brandFilterVal = e.target.value; render(); });
    root.getElementById('clientFilter').addEventListener('change', (e) => { clientFilterVal = e.target.value; render(); });
    root.getElementById('repFilter').addEventListener('change', (e) => { repFilterVal = e.target.value; render(); });
    root.getElementById('unpaidOnlyBtn').addEventListener('click', () => {
      unpaidOnlyVal = !unpaidOnlyVal;
      root.getElementById('unpaidOnlyBtn').classList.toggle('active', unpaidOnlyVal);
      render();
    });

    root.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = root.getElementById('uploadStatus');
      statusEl.textContent = '읽는 중...';
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type:'array', cellDates:true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

          const pick = (row, keys) => {
            for (const k of Object.keys(row)) {
              const norm = k.replace(/\s/g,'');
              if (keys.some(want => norm.includes(want))) return row[k];
            }
            return '';
          };
          const toDateStr = (v) => {
            if (v instanceof Date && !isNaN(v)) return ymd(v);
            const s = String(v || '').trim();
            const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
            if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
            return s || ymd(new Date());
          };
          const toAmount = (v) => {
            const n = Number(String(v).replace(/[^0-9.\-]/g,''));
            return isNaN(n) ? 0 : n;
          };
          const toBool = (v) => {
            const s = String(v).trim();
            return ['O','o','Y','y','완료','발행','입금','예','true','1'].includes(s);
          };

          let added = 0;
          let nextId = rawRevenue.reduce((m,r)=>Math.max(m,r.id),0) + 1;
          rows.forEach(row => {
            const brand = pick(row, ['브랜드']);
            const client = pick(row, ['발주처','거래처']);
            const store = pick(row, ['점포','매장']);
            const dateRaw = pick(row, ['SET일','일자','날짜','수금일','확정일']);
            const amountRaw = pick(row, ['확정금액','견적금액','금액']);
            const confirmedRaw = pick(row, ['확인','발행']);
            const paidRaw = pick(row, ['수금','입금']);
            const repRaw = pick(row, ['담당자','영업사원','담당']);
            if (!brand && !client && !store && !amountRaw) return;
            rawRevenue.push({
              id: nextId++,
              date: toDateStr(dateRaw),
              brand: String(brand || '미분류'),
              client: String(client || ''),
              store: String(store || ''),
              rep: String(repRaw || '미배정'),
              quoteAmount: toAmount(amountRaw),
              finalAmount: toAmount(amountRaw),
              confirmed: toBool(confirmedRaw),
              paid: toBool(paidRaw),
            });
            added++;
          });

          refreshBrandOptions();
          render();
          statusEl.textContent = `${added}건 추가됨 (${file.name})`;
        } catch (err) {
          statusEl.textContent = '파일을 읽지 못했습니다. 컬럼명을 확인해주세요.';
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    });

    root.getElementById('periodTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      [...tab.parentElement.children].forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      period = tab.dataset.p;
      render();
    });

    const PERIOD_LABEL = { month:'월별', quarter:'분기별', year:'연도별' };

    function groupKey(r){
      if (period === 'month') return r.date.slice(0,7);
      if (period === 'quarter') return quarterOf(r.date);
      return r.date.slice(0,4);
    }

    function groupLabel(key){
      if (period === 'month') { const [y,m] = key.split('-'); return `${y}년 ${Number(m)}월`; }
      if (period === 'quarter') { const [y,q] = key.split('-Q'); return `${y}년 ${q}분기`; }
      return `${key}년`;
    }

    // 최종금액 셀 — 기본은 "확정된 값"처럼 읽기 전용으로 보여주고, 수정 아이콘을 눌러야만 편집 모드로 바뀐다.
    // (기존에는 항상 입력창이 열려 있어 "이게 확정인지 수정 중인지" 구분이 안 된다는 피드백을 반영)
    // 최종금액 수정은 영업 관리에서 담당자가 직접 입력하므로, 매출 관리에서는 조회 전용으로만 보여준다.
    // (매출 관리는 함수 맨 앞의 관리자 검증을 통과해야만 여기까지 도달하므로, 별도의 담당자용 마스킹은 필요 없다.)
    function renderFinalCell(r){
      return `<td class="amount final-amount-cell"><span class="final-amount-value">${won(r.finalAmount)}</span></td>`;
    }

    // 입금 — 계약금/중도금/잔금처럼 여러 번에 걸쳐 들어오는 경우가 많아, 진행률로 보여주고
    // 클릭하면 회차별 내역을 보고 고칠 수 있게 한다. 매출 관리는 관리자 전용 화면이라 항상 전체 관리 가능.
    function renderPaymentCellRev(r){
      const total = totalDueRev(r);
      if (!total) return `<span class="pay-cell-btn masked">-</span>`;
      const paid = paidAmountRev(r);
      const pct = Math.max(0, Math.min(100, Math.round(paid / total * 100)));
      if (paid <= 0) return `<button type="button" class="pay-cell-btn none" data-id="${r.id}">미입금</button>`;
      if (paid >= total) return `<button type="button" class="pay-cell-btn full" data-id="${r.id}">입금완료</button>`;
      return `
        <button type="button" class="pay-cell-btn partial" data-id="${r.id}" title="${won(paid)} / ${won(total)}">
          <span class="pay-track"><span class="pay-fill" style="width:${pct}%"></span></span>
          <span class="pay-pct">${pct}%</span>
        </button>
      `;
    }

    // ---- 입금 내역 모달 ----
    let payModalId = null;
    const payOverlay = root.getElementById('payOverlay');
    function openPayModalRev(id){ payModalId = id; renderPayModalRev(); if (payOverlay) payOverlay.hidden = false; }
    function closePayModalRev(){ payModalId = null; if (payOverlay) payOverlay.hidden = true; }
    if (payOverlay) {
      payOverlay.addEventListener('click', (e) => { if (e.target === payOverlay) closePayModalRev(); });
    }
    function renderPayModalRev(){
      if (!payOverlay || payModalId == null) return;
      const r = rawRevenue.find(x => x.id == payModalId);
      if (!r) { closePayModalRev(); return; }
      const total = totalDueRev(r);
      const paid = paidAmountRev(r);
      const remain = Math.max(0, total - paid);
      const pct = total ? Math.max(0, Math.min(100, Math.round(paid / total * 100))) : 0;
      const payments = Array.isArray(r.payments) ? r.payments : [];
      root.getElementById('payModalSub').textContent = `${r.client} · ${r.store} (${r.rep || '-'})`;
      root.getElementById('payModalSummary').innerHTML = `
        <div class="pay-summary-cell"><div class="l">수주액</div><div class="v">${won(total)}</div></div>
        <div class="pay-summary-cell done"><div class="l">입금액</div><div class="v">${won(paid)}</div></div>
        <div class="pay-summary-cell remain"><div class="l">잔액</div><div class="v">${won(remain)}</div></div>
      `;
      root.getElementById('payModalBar').innerHTML = `
        <div class="pay-bar-row">
          <div class="pay-bar-track"><div class="pay-bar-fill" style="width:${pct}%"></div></div>
          <div class="pay-bar-pct">${pct}%</div>
        </div>
      `;
      const listEl = root.getElementById('payModalList');
      if (!payments.length) {
        listEl.innerHTML = `<div class="pay-list-empty">아직 입금된 내역이 없습니다.</div>`;
      } else {
        // 매출 관리에서는 입금 내역을 수정·삭제할 필요가 없다고 해서, 조회 + 추가만 남긴다
        // (수정·삭제는 영업 관리 화면에서 담당자/관리자가 처리).
        listEl.innerHTML = [...payments]
          .map((p, idx) => ({ p, idx }))
          .sort((a, b) => (a.p.date || '').localeCompare(b.p.date || ''))
          .map(({ p }) => `
            <div class="pay-item">
              <div class="pay-item-date mono">${p.date ? p.date.slice(2).replace(/-/g,'.') : '-'}</div>
              <div class="pay-item-memo">${p.memo ? p.memo : ''}</div>
              <div class="pay-item-amount">${won(p.amount)}</div>
            </div>
          `).join('');
      }
      const formEl = root.getElementById('payAddForm');
      formEl.innerHTML = `
        <div class="pay-add-field date"><label>입금일</label><input type="date" id="payAddDate" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="pay-add-field memo"><label>구분</label><select id="payAddMemo">${paymentMemoOptionsHtml('')}</select></div>
        <div class="pay-add-field amount"><label>금액</label><input type="text" inputmode="numeric" class="mono" id="payAddAmount" placeholder="0"></div>
        <button type="button" class="pay-add-btn" id="payAddBtn">추가</button>
      `;
      const amountInput = formEl.querySelector('#payAddAmount');
      attachAmountFormatter(amountInput);
      formEl.querySelector('#payAddBtn').addEventListener('click', () => {
        const dateVal = formEl.querySelector('#payAddDate').value;
        const memoVal = formEl.querySelector('#payAddMemo').value.trim();
        const raw = amountInput.value.replace(/[^\d]/g, '');
        if (!raw || !dateVal) return;
        if (!Array.isArray(r.payments)) r.payments = [];
        r.payments.push({ date: dateVal, amount: Number(raw), memo: memoVal });
        r.paid = isFullyPaidRev(r);
        renderPayModalRev();
        render();
      });
    }
    root.getElementById('payModalClose').addEventListener('click', closePayModalRev);

    function render(){
      let list = rawRevenue.filter(r =>
        (brandFilterVal === '전체' || r.brand === brandFilterVal) &&
        (clientFilterVal === '전체' || r.client === clientFilterVal) &&
        (repFilterVal === '전체' || r.rep === repFilterVal) &&
        (!unpaidOnlyVal || (r.confirmed && !isFullyPaidRev(r)))
      );

      // 수주 확정이 취소된 건(입금 이력 보존을 위해 confirmed:false로 REVENUE_ALL에 남아있는 건)은
      // 더 이상 매출이 아니므로, 매출 건수·매출액 등 통계 계산에서는 제외한다. 표에는 참고용으로
      // 그대로 남겨두되(입금 이력 확인용), "(확정취소)" 표시로 구분해서 헷갈리지 않게 한다.
      const confirmedList = list.filter(r => r.confirmed);

      // 상단 통계 카드는 "내역" 표에서 고른 기간 단위(월별/분기별/연도별)의 "가장 최근 기간" 값만 반영한다.
      // (이전에는 필터링된 전체 목록 합계를 그대로 썼기 때문에 탭을 눌러도 숫자가 안 바뀌는 문제가 있었다.)
      const periodKeys = [...new Set(confirmedList.map(groupKey))].sort((a,b) => b.localeCompare(a));
      const latestKey = periodKeys[0] || null;
      const periodList = latestKey ? confirmedList.filter(r => groupKey(r) === latestKey) : [];

      const count = periodList.length;
      const total = periodList.reduce((s,r) => s + r.finalAmount, 0);
      // 부분입금 중인 건도 실제로 들어온 만큼은 "입금완료" 합계에 반영하고, 나머지는 미수금으로 잡는다.
      const paid = periodList.reduce((s,r) => s + paidAmountRev(r), 0);
      const unpaid = periodList.reduce((s,r) => s + Math.max(0, totalDueRev(r) - paidAmountRev(r)), 0);

      root.getElementById('countLabel').textContent = latestKey ? `${groupLabel(latestKey)} 매출 건수` : `${PERIOD_LABEL[period]} 매출 건수`;
      root.getElementById('periodLabel').textContent = latestKey ? `${groupLabel(latestKey)} 매출액` : `${PERIOD_LABEL[period]} 매출액`;
      root.getElementById('statCount').textContent = `${count}건`;
      root.getElementById('statTotal').textContent = won(total);
      root.getElementById('statPaid').textContent = won(paid);
      root.getElementById('statUnpaid').textContent = won(unpaid);

      // 통계 카드 밑에 짧은 코멘트(이전 기간 대비 증감 · 비중)를 붙여 한눈에 흐름이 보이게 한다.
      const prevKey = periodKeys[1] || null;
      const prevList = prevKey ? confirmedList.filter(r => groupKey(r) === prevKey) : [];
      const prevCount = prevList.length;
      const prevTotal = prevList.reduce((s,r) => s + r.finalAmount, 0);
      const deltaLabelRev = periodDeltaDefs(period, false)[0].label;
      root.getElementById('statCountCmp').innerHTML = prevKey
        ? `<div class="stat-compare"><span class="cmp-item">${deltaLabelRev} ${deltaBadge(count, prevCount)}</span></div>`
        : '';
      root.getElementById('statTotalCmp').innerHTML = prevKey
        ? `<div class="stat-compare"><span class="cmp-item">${deltaLabelRev} ${deltaBadge(total, prevTotal)}</span></div>`
        : '';
      root.getElementById('statPaidNote').textContent = paid > 0 ? `매출액의 ${Math.round(paid / (total || 1) * 100)}%` : '이번 기간 입금 없음';
      root.getElementById('statUnpaidNote').textContent = unpaid > 0 ? `매출액의 ${Math.round(unpaid / (total || 1) * 100)}%` : '미수금 없음';

      const groups = new Map();
      list.forEach(r => {
        const key = groupKey(r);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      });
      const groupKeysSorted = [...groups.keys()].sort((a,b) => b.localeCompare(a));
      // 처음 렌더링될 때만 "가장 최근 묶음"을 기본으로 펼쳐둔다. 그 이후로는
      // expandedGroups가 사용자의 클릭 이력을 그대로 담고 있으므로 다시 초기화하지 않는다.
      if (expandedGroups === null) {
        expandedGroups = new Set(groupKeysSorted.length ? [groupKeysSorted[0]] : []);
      }

      const tbody = root.getElementById('tbody');
      tbody.innerHTML = '';
      let rowIdx = 0;
      if (!groupKeysSorted.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; color:var(--text-faint); padding:24px;">해당 조건의 내역이 없습니다.</td></tr>';
      } else {
        groupKeysSorted.forEach(key => {
          const rows = groups.get(key).sort((a,b) => b.date.localeCompare(a.date));
          // 그룹 소계는 확정취소 건을 뺀 값으로 — 표에 나열되는 실제 행 수와는 다를 수 있다(의도된 동작).
          const confirmedRows = rows.filter(r => r.confirmed);
          const groupQuoteTotal = confirmedRows.reduce((s,r) => s + r.quoteAmount, 0);
          const groupFinalTotal = confirmedRows.reduce((s,r) => s + r.finalAmount, 0);
          const isExpanded = expandedGroups.has(key);

          const headTr = document.createElement('tr');
          headTr.className = 'group-head' + (isExpanded ? ' expanded' : '');
          headTr.style.cursor = 'pointer';
          headTr.innerHTML = `
            <td colspan="8"><span class="group-caret">${isExpanded ? '▾' : '▸'}</span> ${groupLabel(key)} <span style="font-weight:400; color:var(--text-faint)">· ${confirmedRows.length}건</span></td>
            <td class="amount">${won(groupQuoteTotal)}</td>
            <td class="amount">${won(groupFinalTotal)}</td>
            <td class="center"></td>
          `;
          headTr.addEventListener('click', () => {
            if (expandedGroups.has(key)) expandedGroups.delete(key); else expandedGroups.add(key);
            render();
          });
          tbody.appendChild(headTr);

          if (isExpanded) {
            rows.forEach(r => {
              const tr = document.createElement('tr');
              if (!r.confirmed) tr.className = 'revenue-cancelled-row';
              const finalCell = renderFinalCell(r);
              const cancelledTag = r.confirmed ? '' : ' <span class="cancelled-tag" title="수주 확정이 취소된 건입니다. 입금 이력 확인용으로만 남아있고, 매출 통계에는 반영되지 않습니다.">(확정취소)</span>';
              const linkedOrder = linkedOrderOfRev(r);
              rowIdx++;
              tr.innerHTML = `
                <td class="mono col-num">${rowIdx}</td>
                <td>${escapeHtml(brandLabel(r.brand))}</td>
                <td>${escapeHtml(r.client)}${cancelledTag}</td>
                <td>${escapeHtml(r.store)}</td>
                <td>${escapeHtml(r.rep || '-')}</td>
                <td class="mono">${dispDateRev(linkedOrder && linkedOrder.orderDate)}</td>
                <td class="mono">${dispDateRev(linkedOrder && linkedOrder.confirmDate)}</td>
                <td class="mono">${dispDateRev(r.date)}</td>
                <td class="amount">${won(r.quoteAmount)}</td>
                ${finalCell}
                <td class="center">${renderPaymentCellRev(r)}</td>
              `;
              tbody.appendChild(tr);
            });
          }
        });

        const grandQuoteTotal = confirmedList.reduce((s,r) => s + r.quoteAmount, 0);
        const grandTr = document.createElement('tr');
        grandTr.className = 'grand-total';
        grandTr.innerHTML = `
          <td colspan="8">합계 <span style="font-weight:400; color:var(--text-faint)">· ${confirmedList.length}건</span></td>
          <td class="amount">${won(grandQuoteTotal)}</td>
          <td class="amount">${won(total)}</td>
          <td class="center"></td>
        `;
        tbody.appendChild(grandTr);
      }
      tbody.querySelectorAll('.pay-cell-btn').forEach(btn => {
        if (btn.classList.contains('masked')) return;
        btn.addEventListener('click', () => openPayModalRev(btn.dataset.id));
      });
      const totalCount = confirmedList.length;
      root.getElementById('tableFoot').textContent = `${PERIOD_LABEL[period]} 기준 · ${groupKeysSorted.length}개 그룹 · 브랜드: ${brandFilterVal} · 발주처: ${clientFilterVal} · 담당자: ${repFilterVal} · 총 ${totalCount}건`;

      renderAnalysis();
      renderTargets();
    }

    function quarterOf(dateStr){
      const [y,m] = dateStr.split('-').map(Number);
      return `${y}-Q${Math.ceil(m/3)}`;
    }
    function keyForType(r, type){
      if (type === 'month') return r.date.slice(0,7);
      if (type === 'quarter') return quarterOf(r.date);
      return r.date.slice(0,4);
    }
    function targetKeyLabel(type, key){
      if (type === 'month') { const [y,m] = key.split('-'); return `${y}년 ${Number(m)}월`; }
      if (type === 'quarter') { const [y,q] = key.split('-Q'); return `${y}년 ${q}분기`; }
      return `${key}년`;
    }
    const TARGET_KEY_HINT = {
      month: '월간 형식: YYYY-MM (예: 2026-09)',
      quarter: '분기 형식: YYYY-Q분기 (예: 2026-Q3)',
      year: '연간 형식: YYYY (예: 2026)',
    };
    const TARGET_KEY_PATTERN = {
      month: /^\d{4}-\d{2}$/,
      quarter: /^\d{4}-Q[1-4]$/,
      year: /^\d{4}$/,
    };

    root.getElementById('targetTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      [...tab.parentElement.children].forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      targetType = tab.dataset.t;
      root.getElementById('targetFormHint').textContent = TARGET_KEY_HINT[targetType];
      root.getElementById('targetKeyInput').placeholder = targetType === 'month' ? '2026-09' : targetType === 'quarter' ? '2026-Q3' : '2026';
      renderTargets();
    });

    attachAmountFormatter(root.getElementById('targetAmountInput'));
    root.getElementById('addTargetBtn').addEventListener('click', () => {
      const keyInput = root.getElementById('targetKeyInput');
      const amountInput = root.getElementById('targetAmountInput');
      const key = keyInput.value.trim();
      const amount = Number(stripCommas(amountInput.value));
      if (!TARGET_KEY_PATTERN[targetType].test(key)) {
        showToast(`${TARGET_KEY_HINT[targetType]} 형식으로 입력해주세요.`, 'error');
        return;
      }
      if (!amount || amount <= 0) {
        showToast('목표 금액을 입력해주세요.', 'error');
        return;
      }
      const existing = revenueTargets.find(t => t.type === targetType && t.key === key);
      if (existing) {
        existing.amount = amount;
      } else {
        const nextId = revenueTargets.reduce((m,t) => Math.max(m,t.id), 0) + 1;
        revenueTargets.push({ id: nextId, type: targetType, key, amount });
      }
      keyInput.value = '';
      amountInput.value = '';
      renderTargets();
    });

    function renderTargets(){
      // 이 함수에 도달했다는 것 자체가 이미 맨 위의 관리자 검증을 통과했다는 뜻이므로
      // (매출 관리는 관리자만 접근 가능), 여기서 다시 role을 확인할 필요가 없다.
      const panel = root.getElementById('targetPanel');
      const locked = root.getElementById('targetLocked');
      panel.style.display = '';
      locked.style.display = 'none';

      const rows = revenueTargets.filter(t => t.type === targetType).sort((a,b) => b.key.localeCompare(a.key));
      const body = root.getElementById('targetBody');
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-faint); padding:16px;">등록된 목표가 없습니다.</td></tr>';
        return;
      }
      body.innerHTML = rows.map(t => {
        // 수주 확정이 취소된 건(입금 이력 보존을 위해 REVENUE_ALL에는 confirmed:false로 남아있는 건)은
        // 더 이상 매출이 아니므로 목표 달성 실적에서 반드시 제외한다.
        const actual = rawRevenue.filter(r => keyForType(r, t.type) === t.key && r.confirmed).reduce((s,r) => s + r.finalAmount, 0);
        const pct = t.amount > 0 ? (actual / t.amount * 100) : 0;
        // 100%를 넘으면(목표 초과 달성) 막대는 어차피 꽉 찬 채로 보이므로 색과 숫자를 따로 강조해서
        // "딱 100%"와 "훨씬 넘긴 것"을 구분되게 한다.
        const overAchieved = pct > 100;
        const barClass = overAchieved ? 'over' : pct >= 100 ? 'ok' : pct >= 70 ? 'warn' : 'danger';
        return `
          <tr>
            <td>${targetKeyLabel(t.type, t.key)}</td>
            <td class="amount">${won(t.amount)}</td>
            <td class="amount">${won(actual)}</td>
            <td>
              <div class="target-progress-wrap">
                <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${Math.min(pct,100).toFixed(0)}%"></div></div>
                <span class="target-pct${overAchieved ? ' over' : ''}">${pct.toFixed(0)}%${overAchieved ? ' 초과' : ''}</span>
              </div>
            </td>
            <td class="center"><button class="target-del" data-id="${t.id}" title="삭제">✕</button></td>
          </tr>
        `;
      }).join('');
      body.querySelectorAll('.target-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = revenueTargets.findIndex(t => t.id == btn.dataset.id);
          if (idx !== -1) revenueTargets.splice(idx, 1);
          renderTargets();
        });
      });
    }

    /* =========================================================
       매출 분석 — 영업 분석과 동일한 구조(자체 월/분기/년도 탭 + 상단 통계 카드 +
       추이 차트/브랜드 표)로 통일한다. 표 위쪽의 브랜드·발주처·담당자 필터는
       그대로 적용하되, 기간 단위(월/분기/년도)는 내역 표의 periodTabs와
       독립적으로 이 패널 안에서 자체적으로 고른다.
       ========================================================= */
    function analysisKeyOf(dateStr, unit){
      const [y,m] = dateStr.split('-').map(Number);
      if (unit === 'year') return `${y}`;
      if (unit === 'quarter') return `${y}-Q${Math.ceil(m/3)}`;
      return `${y}-${String(m).padStart(2,'0')}`;
    }
    function analysisKeyLabel(key, unit){
      if (unit === 'year') return `${key}년`;
      if (unit === 'quarter') { const [y,q] = key.split('-Q'); return `${y.slice(2)}.${q}Q`; }
      const [,m] = key.split('-'); return `${Number(m)}월`;
    }

    function renderAnalysis(){
      // renderTargets()와 마찬가지로, 이 함수는 이미 관리자 검증을 통과한 세션에서만 호출된다.
      const panel = root.getElementById('analysisPanel');
      const locked = root.getElementById('analysisLocked');
      panel.style.display = '';
      locked.style.display = 'none';

      // 매출 분석은 "내역" 탭의 브랜드·발주처·담당자 필터와 완전히 독립적으로 항상 전체 데이터를 기준으로 본다
      // (탭으로 나눈 이상, 내역에서 걸어둔 필터가 안 보이는 채로 분석에 몰래 적용되면 혼란만 준다).
      // 다만 수주 확정이 취소된 건(입금 이력 보존을 위해 confirmed:false로 남아있는 건)은
      // 더 이상 매출이 아니므로 매출 분석(추이·순위·입금률 등) 전체에서 제외한다.
      const analysisRows = rawRevenue.filter(r => r.confirmed);

      const buckets = new Map(); // key -> { amt, count, paidAmt, unpaidAmt, items }
      analysisRows.forEach(r => {
        const key = analysisKeyOf(r.date, analysisUnit);
        if (!buckets.has(key)) buckets.set(key, { amt:0, count:0, paidAmt:0, unpaidAmt:0, items:[] });
        const b = buckets.get(key);
        b.amt += r.finalAmount; b.count += 1;
        // "매출 내역"의 입금완료·미수금 계산과 똑같이 부분입금(payments 배열)까지 반영한다 —
        // r.paid(전액입금 여부) 하나만 보면 부분입금 중인 건의 실입금액이 통째로 미수금에 잡혀 버린다.
        b.paidAmt += paidAmountRev(r);
        if (r.confirmed) b.unpaidAmt += Math.max(0, totalDueRev(r) - paidAmountRev(r));
        b.items.push({ date: new Date(`${r.date}T00:00:00`), val: r.finalAmount });
      });
      const sortedKeys = [...buckets.keys()].sort();
      const recentKeys = sortedKeys.slice(-8);
      const latestKey = sortedKeys[sortedKeys.length - 1];
      const latest = latestKey ? buckets.get(latestKey) : { amt:0, count:0, paidAmt:0, unpaidAmt:0 };

      // 아직 끝나지 않은(진행 중인) 기간과 비교하면 "전월 대비 하락"처럼 보이는 착시가 생기므로,
      // 최신 구간이 오늘이 속한 진행 중 구간이면 그 사실을 라벨에 바로 표시하고,
      // 비교 대상도 "직전 기간 전체"가 아니라 "오늘까지와 같은 일수" 구간으로 맞춰서 비교한다.
      const todayKeyRev = analysisKeyOf(new Date().toISOString().slice(0,10), analysisUnit);
      const isOngoingRev = latestKey === todayKeyRev;
      const cutoffDayRev = isOngoingRev ? dayIndexInPeriod(new Date(), analysisUnit) : null;
      const periodTag = latestKey ? ` (${analysisKeyLabel(latestKey, analysisUnit)}${isOngoingRev ? ' · 누적' : ''})` : '';
      const paidNoteRev = latest.paidAmt > 0 ? `매출액의 ${Math.round(latest.paidAmt / (latest.amt || 1) * 100)}%` : '이번 기간 입금 없음';
      const unpaidNoteRev = latest.unpaidAmt > 0 ? `매출액의 ${Math.round(latest.unpaidAmt / (latest.amt || 1) * 100)}%` : '미수금 없음';
      root.getElementById('revAnalysisStatRow').innerHTML = `
        <div class="stat">
          <div class="stat-top"><span class="icon-badge green"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><div class="label">총 매출 건수${periodTag}</div></div>
          <div class="num mono">${latest.count}건</div>${compareRowHtml(latestKey, analysisUnit, buckets, 'count', isOngoingRev, cutoffDayRev)}
        </div>
        <div class="stat">
          <div class="stat-top"><span class="icon-badge blue"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span><div class="label">총 매출금액${periodTag}</div></div>
          <div class="num mono">${won(latest.amt)}</div>${compareRowHtml(latestKey, analysisUnit, buckets, 'amt', isOngoingRev, cutoffDayRev)}
        </div>
        <div class="stat">
          <div class="stat-top"><span class="icon-badge green"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><div class="label">입금완료${periodTag}</div></div>
          <div class="num mono info">${won(latest.paidAmt)}</div><div class="stat-note">${paidNoteRev}</div>
        </div>
        <div class="stat">
          <div class="stat-top"><span class="icon-badge red"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span><div class="label">미수금${periodTag}</div></div>
          <div class="num mono danger">${won(latest.unpaidAmt)}</div><div class="stat-note">${unpaidNoteRev}</div>
        </div>
      `;

      const unitLabel = analysisUnit === 'month' ? '월별' : analysisUnit === 'quarter' ? '분기별' : '연도별';

      renderEntityTrendCardRev('revAmtChart', 'revAmtEntitySelect', analysisAmtEntityFilter, v => analysisAmtEntityFilter = v, 'amt', analysisRows, recentKeys, buckets);
      renderEntityTrendCardRev('revCountChart', 'revCountEntitySelect', analysisCountEntityFilter, v => analysisCountEntityFilter = v, 'count', analysisRows, recentKeys, buckets);

      // 브랜드별/발주처별 매출 현황 — 이번 기간(latestKey) 실적을 집계해서 순위 리스트로 보여준다.
      const brandLatestMap = new Map();
      const clientLatestMap = new Map();
      analysisRows.filter(r => analysisKeyOf(r.date, analysisUnit) === latestKey).forEach(r => {
        const b = brandLabel(r.brand);
        // 순위 목록에는 코드(짧은 이름)를 굵게, 전체 명칭은 작은 보조 텍스트로.
        const shortName = shortCode(r.brand);
        const restName = b.startsWith(shortName + ' ') ? b.slice(shortName.length + 1) : '';
        if (!brandLatestMap.has(b)) brandLatestMap.set(b, { name:shortName, sub:restName, full:b, amt:0, count:0 });
        const be = brandLatestMap.get(b); be.amt += r.finalAmount; be.count += 1;
        if (!clientLatestMap.has(r.client)) clientLatestMap.set(r.client, { name:r.client, amt:0, count:0 });
        const ce = clientLatestMap.get(r.client); ce.amt += r.finalAmount; ce.count += 1;
      });
      const brandLatestList = [...brandLatestMap.values()];
      const clientLatestList = [...clientLatestMap.values()];
      renderRankListRev('revBrandRankList', brandLatestList, analysisBrandRankSort, '');
      renderRankListRev('revClientRankList', clientLatestList, analysisClientRankSort, 'rep');
      renderRevInsights(analysisRows, latestKey, brandLatestList, clientLatestList);
    }

    root.getElementById('revAnalysisPeriodTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      analysisUnit = btn.dataset.p;
      [...root.querySelectorAll('#revAnalysisPeriodTabs .tab')].forEach(b => b.classList.toggle('active', b === btn));
      renderAnalysis();
    });
    root.getElementById('revAmtEntitySelect').addEventListener('change', (e) => {
      analysisAmtEntityFilter = e.target.value;
      renderAnalysis();
    });
    root.getElementById('revCountEntitySelect').addEventListener('change', (e) => {
      analysisCountEntityFilter = e.target.value;
      renderAnalysis();
    });
    root.getElementById('revBrandRankTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      analysisBrandRankSort = btn.dataset.s;
      [...root.querySelectorAll('#revBrandRankTabs .tab')].forEach(b => b.classList.toggle('active', b === btn));
      renderAnalysis();
    });
    root.getElementById('revClientRankTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      analysisClientRankSort = btn.dataset.s;
      [...root.querySelectorAll('#revClientRankTabs .tab')].forEach(b => b.classList.toggle('active', b === btn));
      renderAnalysis();
    });

    const exportBtn = root.getElementById('revenueExportBtn');
    if (exportBtn) {
      // 엑셀 내보내기는 관리자 계정에서만 사용 — 매출 관리 화면 자체가 이미 관리자 전용이므로 별도 숨김 처리는 불필요.
      exportBtn.addEventListener('click', () => {
        try {
          const list = rawRevenue.filter(r =>
            (brandFilterVal === '전체' || r.brand === brandFilterVal) &&
            (clientFilterVal === '전체' || r.client === clientFilterVal) &&
            (repFilterVal === '전체' || r.rep === repFilterVal) &&
            (!unpaidOnlyVal || (r.confirmed && !isFullyPaidRev(r)))
          );
          const rows = [['브랜드','발주처','점포명','담당자','수주일','수주확정일','매출일','견적금액','확정금액','확인 여부','입금 여부']].concat(
            list.map(r => {
              const linkedOrder = linkedOrderOfRev(r);
              return [brandLabel(r.brand), r.client, r.store, r.rep || '-', (linkedOrder && linkedOrder.orderDate) || '-', (linkedOrder && linkedOrder.confirmDate) || '-', r.date, r.quoteAmount, r.finalAmount, r.confirmed ? '확인됨' : '확인 대기', isFullyPaidRev(r) ? '입금완료' : (paidAmountRev(r) > 0 ? `입금 진행중(${paidAmountRev(r).toLocaleString('ko-KR')}원)` : '미입금')];
            })
          );
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '매출내역');
          const d = new Date();
          XLSX.writeFile(wb, `도무스_매출관리_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.xlsx`);
        } catch (err) {
          showToast('엑셀 내보내기 중 오류가 발생했습니다: ' + err.message, 'error');
        }
      });
    }

    render();
  }

  /* =========================================================
     Brands page (브랜드·발주처 관리) — 관리자/담당자/경리 모두 열람·수정 가능.
     ========================================================= */
  function initBrandsPage(root){
    let query = '';
    let editingId = null;
    let addingNew = false;
    let pendingDeleteId = null;

    const listBody = root.getElementById('brandListBody');
    const emptyEl = root.getElementById('brandEmpty');
    const searchInput = root.getElementById('brandSearch');
    const addBtn = root.getElementById('brandAddBtn');

    function matches(b, q){
      if (!q) return true;
      const hay = [b.code, b.name, b.client, b.clientCode, ...(b.aliases || []), ...(b.clientAliases || [])].join(' ').toLowerCase();
      return hay.includes(q.toLowerCase());
    }

    // 브랜드 표가 바뀔 때마다 파생 표를 다시 만들고, 기존 수주/매출 기록에도 바로 반영한 뒤
    // 지금 열려 있는 다른 화면들도 최신 상태로 다시 그린다.
    function afterChange(){
      rebuildBrandMaps();
      resyncBrandClient(ORDERS);
      resyncBrandClient(REVENUE_ALL);
      if (window.refreshAllPages) window.refreshAllPages();
      render();
    }

    function aliasChipsHtml(list, kind){
      return (list || []).map((a, i) => `<span class="alias-chip">${escapeHtml(a)} <span class="x" data-kind="${kind}" data-idx="${i}">✕</span></span>`).join('');
    }

    function renderRowView(b){
      const row = document.createElement('div');
      row.className = 'b-row';
      row.innerHTML = `
        <div class="b-row-top">
          <span class="code-badge">${escapeHtml(b.code)}</span>
          <div class="b-row-name">
            <div class="name-main">${escapeHtml(b.name)}</div>
            ${(b.aliases && b.aliases.length) ? `<div class="chip-list">${b.aliases.map(a => `<span class="chip">${escapeHtml(a)}</span>`).join('')}</div>` : ''}
          </div>
          <button type="button" class="edit-link">수정</button>
        </div>
        <div class="b-row-client">
          <span class="client-label">발주처</span>
          ${b.client
            ? `${b.clientCode ? `<span class="code-badge">${escapeHtml(b.clientCode)}</span>` : ''}<span class="client-main">${escapeHtml(b.client)}</span>${(b.clientAliases && b.clientAliases.length) ? `<div class="chip-list">${b.clientAliases.map(a => `<span class="chip">${escapeHtml(a)}</span>`).join('')}</div>` : ''}`
            : `<span class="client-empty">매장마다 다름</span>`}
        </div>
      `;
      row.querySelector('.edit-link').addEventListener('click', () => {
        editingId = b.id; addingNew = false; pendingDeleteId = null; render();
      });
      return row;
    }

    function renderRowEdit(b, isNew){
      const row = document.createElement('div');
      row.className = 'b-row editing';
      let draftAliases = [...(b.aliases || [])];
      let draftClientAliases = [...(b.clientAliases || [])];

      function paint(){
        row.innerHTML = `
          <div class="edit-grid">
            <div class="edit-field"><label>코드</label><input class="e-code" value="${escapeHtml(b.code)}"></div>
            <div class="edit-field"><label>브랜드명 (대표)</label><input class="e-name" value="${escapeHtml(b.name)}"></div>
            <div class="edit-field"><label>발주처 (대표) — 매장마다 다르면 비워두세요</label><input class="e-client" value="${escapeHtml(b.client || '')}"></div>
            <div class="edit-field"><label>발주처 코드 (선택) — 필요할 때만 입력</label><input class="e-clientcode" value="${escapeHtml(b.clientCode || '')}" placeholder="예: KK"></div>
            <div class="edit-field full">
              <label>브랜드 별칭 — 다르게 입력돼도 이 브랜드로 합쳐질 이름들</label>
              <div class="alias-editor">
                ${aliasChipsHtml(draftAliases, 'brand')}
                <input class="alias-add e-brand-alias-input" placeholder="+ 별칭 추가하고 Enter">
              </div>
            </div>
            <div class="edit-field full">
              <label>발주처 별칭</label>
              <div class="alias-editor">
                ${aliasChipsHtml(draftClientAliases, 'client')}
                <input class="alias-add e-client-alias-input" placeholder="+ 별칭 추가하고 Enter">
              </div>
            </div>
          </div>
          ${(!isNew && pendingDeleteId === b.id) ? `
            <div class="edit-actions">
              <span class="delete-confirm-text">정말 삭제할까요? 기존 수주·매출 기록은 그대로 남고, 브랜드 표에서만 없어져요.</span>
              <button type="button" class="btn e-delete-cancel">취소</button>
              <button type="button" class="btn danger-outline e-delete-ok">삭제</button>
            </div>
          ` : `
            <div class="edit-actions">
              ${isNew ? '' : '<button type="button" class="btn danger-outline e-delete">삭제</button>'}
              <button type="button" class="btn e-cancel">취소</button>
              <button type="button" class="btn primary e-save">저장</button>
            </div>
          `}
        `;
        row.querySelectorAll('.x').forEach(x => {
          x.addEventListener('click', () => {
            if (x.dataset.kind === 'brand') draftAliases.splice(Number(x.dataset.idx), 1);
            else draftClientAliases.splice(Number(x.dataset.idx), 1);
            paint();
          });
        });
        const brandInput = row.querySelector('.e-brand-alias-input');
        brandInput.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const v = brandInput.value.trim();
          if (v && !draftAliases.includes(v)) { draftAliases.push(v); paint(); }
        });
        const clientInput = row.querySelector('.e-client-alias-input');
        clientInput.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const v = clientInput.value.trim();
          if (v && !draftClientAliases.includes(v)) { draftClientAliases.push(v); paint(); }
        });
        const cancelBtn = row.querySelector('.e-cancel');
        if (cancelBtn) cancelBtn.addEventListener('click', () => { editingId = null; addingNew = false; render(); });
        const deleteBtn = row.querySelector('.e-delete');
        if (deleteBtn) deleteBtn.addEventListener('click', () => { pendingDeleteId = b.id; paint(); });
        const deleteCancelBtn = row.querySelector('.e-delete-cancel');
        if (deleteCancelBtn) deleteCancelBtn.addEventListener('click', () => { pendingDeleteId = null; paint(); });
        const deleteOkBtn = row.querySelector('.e-delete-ok');
        if (deleteOkBtn) deleteOkBtn.addEventListener('click', () => {
          const idx = BRAND_MASTER.findIndex(x => x.id === b.id);
          if (idx >= 0) BRAND_MASTER.splice(idx, 1);
          editingId = null; pendingDeleteId = null;
          afterChange();
        });
        const saveBtn = row.querySelector('.e-save');
        if (saveBtn) saveBtn.addEventListener('click', () => {
          const code = row.querySelector('.e-code').value.trim();
          const name = row.querySelector('.e-name').value.trim();
          const client = row.querySelector('.e-client').value.trim();
          const clientCode = row.querySelector('.e-clientcode').value.trim();
          if (!code || !name) { showToast('코드와 브랜드명은 꼭 입력해주세요.', 'error'); return; }
          if (isNew) {
            BRAND_MASTER.push({ id: BRAND_ID_SEQ++, code, name, client, clientCode, aliases: draftAliases, clientAliases: draftClientAliases });
          } else {
            Object.assign(b, { code, name, client, clientCode, aliases: draftAliases, clientAliases: draftClientAliases });
          }
          editingId = null; addingNew = false;
          afterChange();
        });
      }
      paint();
      return row;
    }

    function render(){
      const q = query.trim();
      listBody.innerHTML = '';
      const items = BRAND_MASTER.filter(b => matches(b, q));
      emptyEl.hidden = items.length > 0 || addingNew;
      if (addingNew) {
        listBody.appendChild(renderRowEdit({ id:null, code:'', name:'', client:'', clientCode:'', aliases:[], clientAliases:[] }, true));
      }
      items.forEach(b => {
        listBody.appendChild(editingId === b.id ? renderRowEdit(b, false) : renderRowView(b));
      });
    }

    searchInput.addEventListener('input', () => { query = searchInput.value; render(); });
    addBtn.addEventListener('click', () => {
      addingNew = true; editingId = null;
      query = ''; searchInput.value = '';
      render();
    });

    render();
  }

  /* =========================================================
     Custom elements
     ========================================================= */
  class DomusSchedulePage extends HTMLElement {
    connectedCallback(){
      if (this._mounted) return; this._mounted = true;
      this._shadow = this.attachShadow({ mode:'open' });
      this.refresh();
    }
    // 수주 등록에서 새 건이 저장되면(납품 일정 포함) 바로 반영되도록 다시 그린다.
    refresh(){
      if (!this._shadow) return;
      this._shadow.innerHTML = '';
      const style = document.createElement('style');
      style.textContent = scheduleCSS;
      this._shadow.appendChild(style);
      const tpl = document.getElementById('tpl-schedule');
      this._shadow.appendChild(tpl.content.cloneNode(true));
      initSchedulePage(this._shadow);
      enhanceDateInputsKorean(this._shadow);
    }
  }
  class DomusSalesPage extends HTMLElement {
    connectedCallback(){
      if (this._mounted) return; this._mounted = true;
      this._shadow = this.attachShadow({ mode:'open' });
      this.refresh();
    }
    // 로그인/로그아웃 시 담당자·역할이 바뀔 수 있으므로 다시 로그인할 때마다 새로 그린다.
    // (담당자로 로그인하면 본인 건만, 금액도 그대로 보여야 하기 때문)
    refresh(){
      if (!this._shadow) return;
      this._shadow.innerHTML = '';
      const style = document.createElement('style');
      style.textContent = salesCSS;
      this._shadow.appendChild(style);
      const tpl = document.getElementById('tpl-sales');
      this._shadow.appendChild(tpl.content.cloneNode(true));
      initSalesPage(this._shadow, window.currentRole, window.currentRep);
      enhanceTableScrollArrows(this._shadow);
      enhanceDateInputsKorean(this._shadow);
    }
  }
  class DomusOrderFormPage extends HTMLElement {
    connectedCallback(){
      if (this._mounted) return; this._mounted = true;
      this._shadow = this.attachShadow({ mode:'open' });
      this.refresh();
    }
    // 로그인/로그아웃 시 담당자·역할이 바뀔 수 있으므로 다시 로그인할 때마다 새로 그린다.
    // (담당자로 로그인하면 담당자 항목이 본인 이름으로 자동 고정되어야 하기 때문)
    refresh(){
      if (!this._shadow) return;
      this._shadow.innerHTML = '';
      const style = document.createElement('style');
      style.textContent = orderFormCSS;
      this._shadow.appendChild(style);
      const tpl = document.getElementById('tpl-orderform');
      this._shadow.appendChild(tpl.content.cloneNode(true));
      initOrderFormPage(this._shadow);
      enhanceDateInputsKorean(this._shadow);
    }
  }
  class DomusTasksPage extends HTMLElement {
    connectedCallback(){
      if (this._mounted) return; this._mounted = true;
      this._shadow = this.attachShadow({ mode:'open' });
      this.refresh();
    }
    refresh(){
      if (!this._shadow) return;
      this._shadow.innerHTML = '';
      const style = document.createElement('style');
      style.textContent = tasksCSS;
      this._shadow.appendChild(style);
      const tpl = document.getElementById('tpl-tasks');
      this._shadow.appendChild(tpl.content.cloneNode(true));
      initTasksPage(this._shadow);
    }
  }
  class DomusRevenuePage extends HTMLElement {
    connectedCallback(){
      if (this._mounted) return; this._mounted = true;
      this._shadow = this.attachShadow({ mode:'open' });
      this.refresh();
    }
    // 로그인/로그아웃 시 담당자·역할이 바뀔 수 있으므로 다시 로그인할 때마다 새로 그린다.
    refresh(){
      if (!this._shadow) return;
      this._shadow.innerHTML = '';
      const style = document.createElement('style');
      style.textContent = revenueCSS;
      this._shadow.appendChild(style);
      const tpl = document.getElementById('tpl-revenue');
      this._shadow.appendChild(tpl.content.cloneNode(true));
      initRevenuePage(this._shadow, window.currentRole, window.currentRep);
      enhanceTableScrollArrows(this._shadow);
    }
  }
  class DomusBrandsPage extends HTMLElement {
    connectedCallback(){
      if (this._mounted) return; this._mounted = true;
      this._shadow = this.attachShadow({ mode:'open' });
      this.refresh();
    }
    // 브랜드 표는 다른 화면에서도 참조하므로, 데이터가 바뀔 때마다(다른 사람이 고친 경우 포함) 다시 그린다.
    refresh(){
      if (!this._shadow) return;
      this._shadow.innerHTML = '';
      const style = document.createElement('style');
      style.textContent = brandsCSS;
      this._shadow.appendChild(style);
      const tpl = document.getElementById('tpl-brands');
      this._shadow.appendChild(tpl.content.cloneNode(true));
      initBrandsPage(this._shadow);
    }
  }
  // 어느 화면에서든 데이터가 바뀌면(수주 등록 저장 등) 이미 열려 있는 다른 화면들도 즉시 최신 상태로 다시 그린다.
  // excludeTag를 주면 그 화면은 새로고침하지 않는다 — 예: 수주 등록 화면에서 새 브랜드를 등록했을 때,
  // 지금 작성 중인 폼(점포명·수주일·일정 등)까지 같이 날아가지 않도록 자기 자신은 빼고 나머지만 갱신한다.
  window.refreshAllPages = function(excludeTag){
    ['domus-schedule-page','domus-sales-page','domus-orderform-page','domus-tasks-page','domus-revenue-page','domus-brands-page'].forEach(tag => {
      if (tag === excludeTag) return;
      const el = document.querySelector(tag);
      if (el && typeof el.refresh === 'function') el.refresh();
    });
  };

  customElements.define('domus-schedule-page', DomusSchedulePage);
  customElements.define('domus-sales-page', DomusSalesPage);
  customElements.define('domus-orderform-page', DomusOrderFormPage);
  customElements.define('domus-tasks-page', DomusTasksPage);
  customElements.define('domus-revenue-page', DomusRevenuePage);
  customElements.define('domus-brands-page', DomusBrandsPage);

  /* =========================================================
     App shell: login, nav, view switching
     ========================================================= */
  window.currentRole = null;

  const NAV_ITEMS = [
    { key:'schedule', label:'일정표' },
    { key:'orderform', label:'수주 등록' },
    { key:'sales', label:'영업 관리' },
    { key:'revenue', label:'매출 관리', ownerOnly:true },
  ];

  // 사이드바/드롭다운 메뉴가 함께 쓰는 아이콘 — 통계 카드에서 이미 쓰던 것과 같은
  // 선(line) 아이콘 언어로 통일해서 이모지보다 화면 전체와 어울리게 한다.
  const NAV_ICONS = {
    schedule: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    orderform: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>`,
    sales: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="6" height="8"/><rect x="9" y="7" width="6" height="13"/><rect x="15" y="3" width="6" height="17"/></svg>`,
    revenue: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
    brands: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2.5 12.5V2.5h10l8.09 8.09a2 2 0 0 1 0 2.82Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>`,
  };

  let activeView = 'schedule';

  function buildNav(){
    const navGroup = document.getElementById('navGroup');
    const sbNav = document.getElementById('sbNav');
    navGroup.innerHTML = '';
    sbNav.innerHTML = '';
    const isGeneralStaff = window.currentRole === 'staff' && window.currentRep === '일반';
    NAV_ITEMS.forEach(item => {
      if (item.ownerOnly && window.currentRole !== 'owner') return; // skip entirely for staff (매출 관리: 관리자만)
      if (item.key === 'revenue' && isGeneralStaff) return; // 일반 직원: 매출 관리 비노출
      const icon = NAV_ICONS[item.key] || '';
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (item.key === activeView ? ' active' : '');
      btn.dataset.view = item.key;
      btn.innerHTML = `<span class="nav-ic">${icon}</span><span class="label">${item.label}</span>`;
      btn.addEventListener('click', () => switchView(item.key));
      navGroup.appendChild(btn);

      const sbBtn = document.createElement('button');
      sbBtn.className = 'sb-item' + (item.key === activeView ? ' active' : '');
      sbBtn.dataset.view = item.key;
      sbBtn.innerHTML = `${icon}<span class="label">${item.label}</span>`;
      sbBtn.addEventListener('click', () => switchView(item.key));
      sbNav.appendChild(sbBtn);
    });
  }

  // 일정표는 일반/현장(TV) 두 모드를 갖는다 — 사이드바는 "일정표 화면 + 현장 모드"일 때만
  // 숨기고 떠 있는 햄버거 메뉴로 돌아간다. 일반 모드에서는 다른 화면과 똑같이 사이드바를 보여준다.
  window.updateSidebarState = function(){
    const scheduleEl = document.querySelector('domus-schedule-page');
    const isTv = !!(scheduleEl && scheduleEl.classList.contains('mode-tv'));
    document.getElementById('appShell').classList.toggle('sidebar-hidden', activeView === 'schedule' && isTv);
  };

  function switchView(view){
    activeView = view;
    document.querySelectorAll('.view-page').forEach(p => {
      p.hidden = p.dataset.view !== view;
    });
    document.querySelectorAll('.nav-btn, .sb-item').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    // 사이드바/일정표 메뉴에서 일정표로 이동할 때는 항상 일반 모드로 들어간다
    // (현장 TV 모드는 그 화면 안에서 "일정표" 글자를 눌러 직접 들어가는 전용 진입점).
    if (view === 'schedule') {
      const scheduleEl = document.querySelector('domus-schedule-page');
      if (scheduleEl && typeof scheduleEl.__scheduleSetMode === 'function') scheduleEl.__scheduleSetMode('general');
    }
    window.updateSidebarState();
    closeNavMenu();
  }

  function openNavMenu(){
    document.getElementById('navDropdown').hidden = false;
    document.getElementById('navBackdrop').hidden = false;
    document.getElementById('menuBtn').classList.add('active');
    document.getElementById('menuBtn').setAttribute('aria-expanded', 'true');
  }
  function closeNavMenu(){
    document.getElementById('navDropdown').hidden = true;
    document.getElementById('navBackdrop').hidden = true;
    document.getElementById('menuBtn').classList.remove('active');
    document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
  }
  function toggleNavMenu(){
    if (document.getElementById('navDropdown').hidden) openNavMenu(); else closeNavMenu();
  }

  function enterApp(role, rep){
    window.currentRole = role;
    window.currentRep = rep || null;
    const roleText = role === 'owner' ? '관리자' : role === 'accounting' ? '경리' : `직원 (${rep})`;
    document.getElementById('roleIndicatorText').textContent = roleText;
    document.getElementById('sbRoleIndicatorText').textContent = roleText;
    const revenueEl = document.querySelector('domus-revenue-page');
    if (revenueEl && revenueEl.refresh) revenueEl.refresh();
    const orderformEl = document.querySelector('domus-orderform-page');
    if (orderformEl && orderformEl.refresh) orderformEl.refresh();
    const salesEl = document.querySelector('domus-sales-page');
    if (salesEl && salesEl.refresh) salesEl.refresh();
    buildNav();
    activeView = 'schedule';
    switchView('schedule');
    document.getElementById('loginScreen').hidden = true;
    document.getElementById('appShell').hidden = false;
  }

  function doLogout(){
    window.currentRole = null;
    window.currentRep = null;
    document.getElementById('appShell').hidden = true;
    document.getElementById('loginScreen').hidden = false;
  }

  // 관리자 = 이재황 (담당자 선택 목록에서는 제외되고, 관리자로 바로 로그인)
  document.getElementById('loginOwnerBtn').addEventListener('click', () => enterApp('owner', '이재황'));
  // 경리 = 특정 담당자에 속하지 않는 별도 계정. 화면 구성은 담당자와 거의 같지만,
  // 영업 관리에서는 모든 담당자의 건을 다 보고 금액 확인·입금 내역 수정까지 할 수 있어야 한다.
  document.getElementById('loginAccountingBtn').addEventListener('click', () => enterApp('accounting', null));
  document.querySelectorAll('#loginButtons .login-btn[data-rep]').forEach(btn => {
    btn.addEventListener('click', () => enterApp('staff', btn.dataset.rep));
  });
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('sbLogoutBtn').addEventListener('click', doLogout);
  document.getElementById('menuBtn').addEventListener('click', toggleNavMenu);
  document.getElementById('navBackdrop').addEventListener('click', closeNavMenu);

})();
</script>
</body>
</html>
